name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fast Install XcodeGen
        run: |
          curl -sL https://github.com/yonaskolb/XcodeGen/releases/download/2.42.0/xcodegen.zip -o xcodegen.zip
          unzip -q xcodegen.zip
          sudo cp xcodegen/bin/xcodegen /usr/local/bin/

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App & Package IPA
        run: |
          xcodebuild build \
            -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH=$(find build/DerivedData -name "CloudFlareScan.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan_TrollStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan_TrollStore
          path: CloudFlareScan_TrollStore.ipa
