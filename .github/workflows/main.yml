              self.logView.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.logView.textColor = [UIColor colorWithRed:0.8 green:0.9 blue:1.0 alpha:1];
              self.logView.font = [UIFont systemFontOfSize:11];
