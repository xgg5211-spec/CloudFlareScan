              self.timeoutField.leftViewMode = UITextFieldViewModeAlways;
              [settingBg addSubview:self.timeoutField];

              UILabel *threadLabel = [[UILabel alloc] init];
              threadLabel.text = @"⚡ 线程:";
              threadLabel.textColor = [UIColor grayColor];
              threadLabel.font = [UIFont systemFontOfSize:11];
