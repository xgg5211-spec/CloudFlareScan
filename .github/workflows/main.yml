name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建源码
        run: |
          mkdir -p CloudFlareScan

          cat > CloudFlareScan/main.m << 'EOF'
          #import <UIKit/UIKit.h>
          #import <Network/Network.h>
          #import <sys/socket.h>
          #import <netinet/in.h>
          #import <arpa/inet.h>

          @interface IPInfo : NSObject
          @property (nonatomic, strong) NSString *ip;
          @property (nonatomic, assign) NSInteger port;
          @property (nonatomic, assign) double tcpDelay;
          @property (nonatomic, assign) double tlsDelay;
          @property (nonatomic, assign) double httpDelay;
          @property (nonatomic, assign) double fullDelay;
          @property (nonatomic, strong) NSString *country;
          @property (nonatomic, strong) NSString *city;
          @property (nonatomic, strong) NSString *isp;
          @property (nonatomic, strong) NSString *colo;
          @property (nonatomic, strong) NSString *region;
          @property (nonatomic, strong) NSString *ipVersion;
          @property (nonatomic, assign) BOOL isAvailable;
          @property (nonatomic, assign) double bestDelay;
          @property (nonatomic, strong) NSString *quality;
          @end
          @implementation IPInfo
          @end

          NSDictionary* airportCodes(void) {
              static NSDictionary *dict = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  dict = @{
                      @"HKG": @"香港", @"TPE": @"台北", @"KHH": @"高雄",
                      @"NRT": @"东京", @"HND": @"东京", @"KIX": @"大阪",
                      @"ICN": @"首尔", @"SIN": @"新加坡", @"BKK": @"曼谷",
                      @"KUL": @"吉隆坡", @"MNL": @"马尼拉",
                      @"SJC": @"圣何塞", @"LAX": @"洛杉矶", @"SFO": @"旧金山",
                      @"SEA": @"西雅图", @"ORD": @"芝加哥", @"JFK": @"纽约",
                      @"LHR": @"伦敦", @"CDG": @"巴黎", @"FRA": @"法兰克福",
                      @"AMS": @"阿姆斯特丹", @"SYD": @"悉尼"
                  };
              });
              return dict;
          }

          @interface ViewController : UIViewController <UITableViewDelegate, UITableViewDataSource, UITextViewDelegate>
          @property (nonatomic, strong) NSMutableArray *results;
          @property (nonatomic, strong) NSMutableArray *filteredResults;
          @property (nonatomic, strong) UITextView *inputView;
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UILabel *countLabel;
          @property (nonatomic, strong) UIButton *scanBtn;
          @property (nonatomic, strong) UIButton *stopBtn;
          @property (nonatomic, strong) UIButton *importBtn;
          @property (nonatomic, strong) UIButton *resultCopyBtn;
          @property (nonatomic, strong) UIButton *clearBtn;
          @property (nonatomic, strong) UITextField *portField;
          @property (nonatomic, strong) UITextField *timeoutField;
          @property (nonatomic, strong) UITextField *threadField;
          @property (nonatomic, strong) UITextField *filterField;
          @property (nonatomic, strong) UITextField *filterPortField;
          @property (nonatomic, assign) BOOL isScanning;
          @property (nonatomic, strong) UIActivityIndicatorView *activityIndicator;
          @property (nonatomic, strong) UISegmentedControl *tabControl;
          @property (nonatomic, strong) UITextView *logView;

          - (void)applyFilter;
          - (void)updateStats;
          - (void)updateOutput;
          - (void)logMessage:(NSString *)msg;
          @end

          @implementation ViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.title = @"🌐 优选IP筛选";
              self.results = [NSMutableArray array];
              self.filteredResults = [NSMutableArray array];
              [self setupUI];
              [self detectISP];
          }

          - (void)setupUI {
