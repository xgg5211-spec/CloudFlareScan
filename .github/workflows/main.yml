name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建源码
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj

          cat > CloudFlareScan/App.swift << 'EOF'
          import SwiftUI

          @main
          struct CloudFlareScanApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI
          import Network

          // MARK: - 颜色主题
          struct AppColors {
              static let bg = Color(red: 0.06, green: 0.08, blue: 0.15)
              static let card = Color(red: 0.10, green: 0.13, blue: 0.22)
              static let accent = Color(red: 0.0, green: 0.78, blue: 0.98)
              static let green = Color(red: 0.0, green: 0.9, blue: 0.5)
              static let orange = Color(red: 1.0, green: 0.7, blue: 0.0)
              static let text = Color.white
              static let gray = Color(red: 0.5, green: 0.6, blue: 0.8)
          }

          // MARK: - 数据模型
          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double = -1
              var country: String = ""
              var city: String = ""
              var isp: String = ""
              var colo: String = ""
              var region: String = ""
              var ipVersion: String = "IPv4"
              var isAvailable: Bool = false

              var quality: String {
                  let d = delay
                  switch d {
                  case ..<30: return "🏆极速"
                  case ..<60: return "⭐优秀"
                  case ..<100: return "👍良好"
                  case ..<200: return "📶一般"
                  default: return "🐢较慢"
                  }
              }

              var qualityColor: Color {
                  let d = delay
                  switch d {
                  case ..<30: return .purple
                  case ..<60: return AppColors.green
                  case ..<100: return .blue
                  case ..<200: return AppColors.orange
                  default: return .red
                  }
              }
          }

          // MARK: - 扫描管理器
          class ScanManager: ObservableObject {
              @Published var results: [IPInfo] = []
              @Published var filteredResults: [IPInfo] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var progress: Double = 0
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var avgDelay: Double = 0

              @Published var detectedISP: String = "检测中..."
              @Published var detectedIP: String = "检测中..."
              @Published var detectedCountry: String = "检测中..."
              @Published var inputText: String = ""
              @Published var selectedPort: Int = 443
              @Published var timeoutValue: Int = 3
              @Published var threadCount: Int = 100
              @Published var filterCountry: String = ""
              @Published var filterPort: String = ""

              private var scanTask: Task<Void, Never>?
              private let semaphore = DispatchSemaphore(value: 100)
              private let lock = NSLock()

              let ports = [443, 2053, 2083, 2087, 2096, 8443]

              // MARK: - 自动检测
              func detect() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp,country,query") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          DispatchQueue.main.async {
                              self.detectedISP = json["isp"] as? String ?? "未知"
                              self.detectedIP = json["query"] as? String ?? "未知"
                              self.detectedCountry = json["country"] as? String ?? "未知"
                          }
                      }
                  }.resume()
              }

              // MARK: - 导入IP
              func importIPs() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var list: [IPInfo] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          let version = ip.contains(":") ? "IPv6" : "IPv4"
                          list.append(IPInfo(ip: ip, port: port, ipVersion: version))
                      }
                  }
                  results = []
                  filteredResults = []
                  availableCount = 0
                  bestDelay = 0
                  avgDelay = 0
                  statusText = "已导入 \(list.count) 个IP"
              }

              // MARK: - 生成IP
              func generateIPs() {
                  let ranges = [
                      "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
                      "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
                      "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
                      "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
                      "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
                  ]
                  var ips: [String] = []
                  for cidr in ranges {
                      let parts = cidr.split(separator: "/")
                      guard parts.count == 2, let prefix = Int(parts[1]) else { continue }
                      let ipParts = parts[0].split(separator: ".")
                      guard ipParts.count == 4 else { continue }
                      let base = (UInt32(ipParts[0])! << 24) | (UInt32(ipParts[1])! << 16) | (UInt32(ipParts[2])! << 8) | UInt32(ipParts[3])!
                      let count = 1 << (32 - prefix)
                      for i in 1...min(count, 100) {
                          let addr = base + UInt32(i)
                          let ip = "\((addr >> 24) & 255).\((addr >> 16) & 255).\((addr >> 8) & 255).\(addr & 255)"
                          ips.append(ip)
                      }
                  }
                  inputText = ips.joined(separator: "\n")
                  statusText = "已生成 \(ips.count) 个IP"
              }

              // MARK: - 开始扫描
              func startScan() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var ips: [IPInfo] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPInfo(ip: ip, port: port, ipVersion: ip.contains(":") ? "IPv6" : "IPv4"))
                      }
                  }

                  guard !ips.isEmpty else {
                      statusText = "请导入IP"
                      return
                  }

                  isScanning = true
                  results = []
                  filteredResults = []
                  availableCount = 0
                  bestDelay = 0
                  avgDelay = 0
                  progress = 0
                  statusText = "扫描中..."

                  let timeout = timeoutValue
                  let port = selectedPort
                  var allResults: [IPInfo] = []
                  var processed = 0
                  let total = ips.count

                  scanTask = Task.detached(priority: .high) {
                      let semaphore = self.semaphore
                      let lock = self.lock

                      await withTaskGroup(of: IPInfo?.self) { group in
                          for ip in ips {
                              if Task.isCancelled { break }
                              group.addTask {
                                  semaphore.wait()
                                  defer { semaphore.signal() }
                                  return await self.testIP(ip: ip, port: port, timeout: timeout)
                              }
                          }

                          for await result in group {
                              lock.lock()
                              if let r = result {
                                  allResults.append(r)
                              }
                              processed += 1
                              lock.unlock()

                              await MainActor.run {
                                  let available = allResults.filter { $0.isAvailable }
                                  self.results = available
                                  self.availableCount = available.count
                                  self.progress = Double(processed) / Double(total)
                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                      self.avgDelay = delays.reduce(0, +) / Double(delays.count)
                                  }
                                  self.statusText = "扫描中... \(self.availableCount) 个可用"
                                  self.applyFilters()
                              }
                          }
                      }

                      await MainActor.run {
                          self.isScanning = false
                          self.progress = 1.0
                          self.statusText = "✅ 完成！共 \(self.availableCount) 个可用IP"
                      }
                  }
              }

              // MARK: - 测试IP
              private func testIP(ip: IPInfo, port: Int, timeout: Int) async -> IPInfo? {
                  let urlString = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlString) else { return nil }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  do {
                      let (data, response) = try await session.data(from: url)
                      if let httpResponse = response as? HTTPURLResponse, httpResponse.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""
                          var colo = ""
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }

                          var result = ip
                          result.port = port
                          result.delay = delay
                          result.colo = colo
                          result.isAvailable = true

                          let locUrl = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country,city,isp,regionName")!
                          if let (data, _) = try? await URLSession.shared.data(from: locUrl),
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                              result.country = json["country"] as? String ?? ""
                              result.city = json["city"] as? String ?? ""
                              result.isp = json["isp"] as? String ?? ""
                              result.region = json["regionName"] as? String ?? ""
                          }
                          return result
                      }
                  } catch {
                      return nil
                  }
                  return nil
              }

              // MARK: - 停止
              func stopScan() {
                  scanTask?.cancel()
                  isScanning = false
                  statusText = "已停止"
              }

              // MARK: - 筛选
              func applyFilters() {
                  var filtered = results
                  if !filterCountry.isEmpty {
                      filtered = filtered.filter {
                          $0.country.localizedCaseInsensitiveContains(filterCountry) ||
                          $0.region.localizedCaseInsensitiveContains(filterCountry)
                      }
                  }
                  if !filterPort.isEmpty, let port = Int(filterPort) {
                      filtered = filtered.filter { $0.port == port }
                  }
                  filteredResults = filtered
              }

              // MARK: - 复制
              func copyIPs() {
                  let text = filteredResults.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制"
              }

              func copyDetails() {
                  let text = filteredResults.map {
                      "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)  \($0.isp)"
                  }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制详情"
              }

              func copyReport() {
                  var report = "# CloudFlare 优选IP报告\n"
                  report += "# 运营商: \(detectedISP)\n"
                  report += "# 国家: \(detectedCountry)\n"
                  report += "# 可用IP: \(availableCount)\n"
                  report += "# 最佳延迟: \(String(format: "%.0f", bestDelay))ms\n\n"
                  for (i, ip) in filteredResults.enumerated() {
                      report += "\(i+1). \(ip.ip):\(ip.port)  [\(String(format: "%.0f", ip.delay))ms]  \(ip.country)  \(ip.colo)\n"
                  }
                  UIPasteboard.general.string = report
                  statusText = "✅ 已复制报告"
              }

              var outputText: String {
                  filteredResults.map {
                      "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)"
                  }.joined(separator: "\n")
              }
          }

          // MARK: - 主视图
          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var alertMsg = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          AppColors.bg.ignoresSafeArea()

                          ScrollView {
                              VStack(spacing: 12) {
                                  // 标题
                                  HStack {
                                      VStack(alignment: .leading, spacing: 2) {
                                          Text("🚀 优选IP筛选")
                                              .font(.title2)
                                              .fontWeight(.bold)
                                              .foregroundColor(.white)
                                          Text("CloudFlare 智能优选")
                                              .font(.caption)
                                              .foregroundColor(AppColors.gray)
                                      }
                                      Spacer()
                                      if manager.isScanning {
                                          ProgressView().scaleEffect(0.7)
                                      }
                                  }
                                  .padding(.horizontal, 4)

                                  // 状态概览
                                  HStack(spacing: 8) {
                                      StatCard(label: "总数", value: "\(manager.results.count + manager.filteredResults.count)", color: .gray)
                                      StatCard(label: "可用", value: "\(manager.availableCount)", color: AppColors.green)
                                      StatCard(label: "最佳", value: manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--", color: AppColors.orange)
                                      StatCard(label: "平均", value: manager.avgDelay > 0 ? String(format: "%.0fms", manager.avgDelay) : "--", color: AppColors.accent)
                                  }
                                  .padding(8)
                                  .background(AppColors.card)
                                  .cornerRadius(10)

                                  // 运营商信息
                                  HStack(spacing: 12) {
                                      Label("📶 \(manager.detectedISP)", systemImage: "antenna.radiowaves.left.and.right")
                                          .font(.caption)
                                          .foregroundColor(AppColors.accent)
                                      Spacer()
                                      Label("📍 \(manager.detectedCountry)", systemImage: "location")
                                          .font(.caption)
                                          .foregroundColor(AppColors.gray)
                                      Label("🆔 \(manager.detectedIP)", systemImage: "network")
                                          .font(.caption)
                                          .foregroundColor(AppColors.gray)
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 6)
                                  .background(AppColors.card)
                                  .cornerRadius(8)

                                  // 进度
                                  if manager.isScanning {
                                      ProgressView(value: manager.progress)
                                          .progressViewStyle(LinearProgressViewStyle(tint: AppColors.accent))
                                          .padding(.horizontal, 4)
                                  }

                                  // 导入
                                  VStack(alignment: .leading, spacing: 6) {
                                      HStack {
                                          Text("📂 导入IP")
                                              .font(.headline)
                                              .foregroundColor(.white)
                                          Spacer()
                                          Button("自动生成") {
                                              manager.generateIPs()
                                          }
                                          .font(.caption)
                                          .foregroundColor(AppColors.accent)
                                      }
                                      TextEditor(text: $manager.inputText)
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 60)
                                          .background(AppColors.bg)
                                          .cornerRadius(6)
                                          .overlay(RoundedRectangle(cornerRadius: 6).stroke(AppColors.card, lineWidth: 1))
                                  }
                                  .padding(12)
                                  .background(AppColors.card)
                                  .cornerRadius(10)

                                  // 按钮
                                  HStack(spacing: 6) {
                                      Button("📥 导入") { manager.importIPs(); alertMsg = "已导入"; }
                                          .buttonStyle(TechBtn(color: .blue))

                                      Button("▶ 扫描") { manager.startScan() }
                                          .buttonStyle(TechBtn(color: AppColors.accent))
                                          .disabled(manager.isScanning)

                                      Button("⏹ 停止") { manager.stopScan() }
                                          .buttonStyle(TechBtn(color: .red))
                                          .disabled(!manager.isScanning)

                                      Menu {
                                          Button("复制IP") { manager.copyIPs(); alertMsg = "已复制" }
                                          Button("复制详情") { manager.copyDetails(); alertMsg = "已复制详情" }
                                          Button("复制报告") { manager.copyReport(); alertMsg = "已复制报告" }
                                      } label: {
                                          Label("📋", systemImage: "doc.on.doc")
                                              .font(.caption)
                                              .padding(.horizontal, 10)
                                              .padding(.vertical, 8)
                                              .background(AppColors.card)
                                              .cornerRadius(6)
                                              .foregroundColor(AppColors.accent)
                                      }
                                      .disabled(manager.results.isEmpty)

                                      Button("🗑 清空") {
                                          manager.results = []
                                          manager.filteredResults = []
                                          manager.availableCount = 0
                                          manager.bestDelay = 0
                                          manager.avgDelay = 0
                                          alertMsg = "已清空"
                                      }
                                      .buttonStyle(TechBtn(color: .gray))
                                  }

                                  // 设置
                                  HStack(spacing: 8) {
                                      Picker("端口", selection: $manager.selectedPort) {
                                          ForEach(manager.ports, id: \.self) { Text("\($0)").tag($0) }
                                      }
                                      .pickerStyle(MenuPickerStyle())
                                      .frame(width: 70)
                                      .tint(AppColors.accent)

                                      Text("超时:")
                                          .font(.caption2)
                                          .foregroundColor(AppColors.gray)
                                      TextField("3", value: $manager.timeoutValue, format: .number)
                                          .textFieldStyle(TechField())
                                          .frame(width: 40)

                                      Text("线程:")
                                          .font(.caption2)
                                          .foregroundColor(AppColors.gray)
                                      TextField("100", value: $manager.threadCount, format: .number)
                                          .textFieldStyle(TechField())
                                          .frame(width: 40)

                                      Spacer()

                                      Text(manager.statusText)
                                          .font(.caption2)
                                          .foregroundColor(AppColors.gray)
                                  }

                                  // 筛选
                                  HStack {
                                      Text("🔍 地区:")
                                          .font(.caption2)
                                          .foregroundColor(AppColors.gray)
                                      TextField("筛选", text: $manager.filterCountry)
                                          .textFieldStyle(TechField())
                                          .frame(width: 70)
                                          .onChange(of: manager.filterCountry) { _ in manager.applyFilters() }

                                      Text("端口:")
                                          .font(.caption2)
                                          .foregroundColor(AppColors.gray)
                                      TextField("端口", text: $manager.filterPort)
                                          .textFieldStyle(TechField())
                                          .frame(width: 40)
                                          .onChange(of: manager.filterPort) { _ in manager.applyFilters() }

                                      Spacer()
                                      Text("显示 \(manager.filteredResults.count) 个")
                                          .font(.caption2)
                                          .foregroundColor(AppColors.accent)
                                  }

                                  // 列表
                                  List(manager.filteredResults) { ip in
                                      HStack {
                                          VStack(alignment: .leading, spacing: 1) {
                                              Text(ip.ip)
                                                  .font(.system(.caption, design: .monospaced))
                                                  .foregroundColor(.white)
                                              if !ip.colo.isEmpty {
                                                  Text("🏢\(ip.colo)")
                                                      .font(.caption2)
                                                      .foregroundColor(AppColors.accent)
                                              }
                                          }
                                          Text(":\(ip.port)")
                                              .font(.caption2)
                                              .foregroundColor(AppColors.gray)
                                          Spacer()
                                          Text("\(String(format: "%.0f", ip.delay))ms")
                                              .font(.caption)
                                              .fontWeight(.bold)
                                              .foregroundColor(ip.qualityColor)
                                          Text(ip.quality)
                                              .font(.caption2)
                                          Text("📍\(ip.country)")
                                              .font(.caption2)
                                              .foregroundColor(AppColors.gray)
                                      }
                                      .padding(.vertical, 2)
                                  }
                                  .listStyle(.plain)
                                  .scrollContentBackground(.hidden)
                                  .frame(height: 200)

                                  // 输出
                                  VStack(alignment: .leading, spacing: 4) {
                                      Text("📝 输出")
                                          .font(.caption)
                                          .foregroundColor(AppColors.gray)
                                      TextEditor(text: .constant(manager.outputText))
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 50)
                                          .background(AppColors.bg)
                                          .cornerRadius(6)
                                          .overlay(RoundedRectangle(cornerRadius: 6).stroke(AppColors.card, lineWidth: 1))
                                  }
                              }
                              .padding(.horizontal, 12)
                              .padding(.bottom, 20)
                          }
                      }
                      .navigationTitle("")
                      .navigationBarTitleDisplayMode(.inline)
                      .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                          Button("确定") { alertMsg = "" }
                      }
                      .onAppear {
                          manager.detect()
                          manager.inputText = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0"
                      }
                  }
              }
          }

          struct StatCard: View {
              let label: String
              let value: String
              let color: Color

              var body: some View {
                  VStack(spacing: 0) {
                      Text(label)
                          .font(.caption2)
                          .foregroundColor(AppColors.gray)
                      Text(value)
                          .font(.subheadline)
                          .fontWeight(.semibold)
                          .foregroundColor(color)
                  }
                  .frame(maxWidth: .infinity)
              }
          }

          struct TechBtn: ButtonStyle {
              let color: Color

              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .font(.caption)
                      .padding(.horizontal, 10)
                      .padding(.vertical, 6)
                      .background(color.opacity(0.2))
                      .foregroundColor(color)
                      .cornerRadius(6)
                      .overlay(RoundedRectangle(cornerRadius: 6).stroke(color.opacity(0.3), lineWidth: 0.5))
              }
          }

          struct TechField: TextFieldStyle {
              func _body(configuration: TextField<Self._Label>) -> some View {
                  configuration
                      .font(.caption)
                      .foregroundColor(.white)
                      .padding(.horizontal, 4)
                      .padding(.vertical, 3)
                      .background(AppColors.bg)
                      .cornerRadius(4)
                      .overlay(RoundedRectangle(cornerRadius: 4).stroke(AppColors.card, lineWidth: 1))
              }
          }
          EOF

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 创建项目文件
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  A100000001 /* App.swift in Sources */ = {isa = PBXBuildFile; fileRef = A100000002 /* App.swift */; };
                  A100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = A100000004 /* ContentView.swift */; };
