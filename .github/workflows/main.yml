          - (void)tabChanged:(UISegmentedControl *)sender {
              if (sender.selectedSegmentIndex == 0) {
                  self.tableView.superview.hidden = NO;
                  self.logView.hidden = YES;
              } else {
                  self.tableView.superview.hidden = YES;
                  self.logView.hidden = NO;
              }
          }

          - (void)toggleStrictMode:(UISwitch *)sender {
              [self logMessage:sender.on ? @"🔒 TLS开启" : @"🔓 TLS关闭"];
          }

          - (void)logMessage:(NSString *)msg {
              dispatch_async(dispatch_get_main_queue(), ^{
                  NSDateFormatter *formatter = [[NSDateFormatter alloc] init];
                  formatter.dateFormat = @"HH:mm:ss";
                  NSString *time = [formatter stringFromDate:[NSDate date]];
                  self.logView.text = [NSString stringWithFormat:@"%@\n[%@] %@", self.logView.text, time, msg];
                  [self.logView scrollRangeToVisible:NSMakeRange(self.logView.text.length - 1, 1)];
              });
          }

          - (void)detectISP {
              NSURL *url = [NSURL URLWithString:@"http://ip-api.com/json/?fields=isp,country,city"];
              [[[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if (json[@"isp"]) {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              UILabel *l = [self.view viewWithTag:100];
                              l.text = [NSString stringWithFormat:@"📍 %@", json[@"isp"]];
                              [self logMessage:[NSString stringWithFormat:@"📶 运营商: %@", json[@"isp"]]];
                          });
                      }
                  }
              }] resume];
          }

          - (void)importIPs {
              [self.results removeAllObjects];
              [self.filteredResults removeAllObjects];
              [self.tableView reloadData];
              self.statusLabel.text = @"🟢 已导入";
              self.statusLabel.textColor = [UIColor colorWithRed:0 green:0.9 blue:0.5 alpha:1];
              self.countLabel.text = @"📊 总数:0 可用:0 最佳:-- 平均:--";
              [self.view endEditing:YES];

              UITextView *outView = [self.view viewWithTag:300];
              outView.text = @"等待扫描...";
              outView.textColor = [UIColor grayColor];

              NSArray *lines = [self.inputView.text componentsSeparatedByString:@"\n"];
              NSInteger count = 0;
              for (NSString *line in lines) {
                  NSString *trim = [line stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
                  if (trim.length > 0) count++;
              }
              [self logMessage:[NSString stringWithFormat:@"📥 已导入 %ld 个IP", (long)count]];
          }

          - (void)clearAll {
              [self.results removeAllObjects];
              [self.filteredResults removeAllObjects];
              [self.tableView reloadData];
              self.inputView.text = @"";
              self.statusLabel.text = @"🟢 已清空";
              self.countLabel.text = @"📊 总数:0 可用:0 最佳:-- 平均:--";
              UITextView *outView = [self.view viewWithTag:300];
              outView.text = @"等待扫描...";
              outView.textColor = [UIColor grayColor];
              [self logMessage:@"🗑 已清空"];
          }

          - (void)startScan {
              NSString *text = self.inputView.text;
              NSArray *lines = [text componentsSeparatedByString:@"\n"];
              NSMutableArray *ips = [NSMutableArray array];

              for (NSString *line in lines) {
                  NSString *trim = [line stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
                  if (trim.length == 0) continue;
                  NSArray *parts = [trim componentsSeparatedByString:@":"];
                  NSString *ip = parts.firstObject;
                  NSInteger port = 443;
                  if (parts.count > 1) port = [parts[1] integerValue];
                  if (port == 0) port = 443;
                  if ([ip containsString:@"."] || [ip containsString:@":"]) {
                      IPInfo *info = [[IPInfo alloc] init];
                      info.ip = ip;
                      info.port = port;
                      info.ipVersion = [ip containsString:@":"] ? @"IPv6" : @"IPv4";
                      [ips addObject:info];
                  }
              }

              if (ips.count == 0) {
                  self.statusLabel.text = @"⚠️ 请导入有效IP";
                  self.statusLabel.textColor = [UIColor yellowColor];
                  [self logMessage:@"⚠️ 没有有效IP"];
                  return;
              }

              [self.results removeAllObjects];
              [self.filteredResults removeAllObjects];
              self.isScanning = YES;
              self.scanBtn.enabled = NO;
              self.stopBtn.enabled = YES;
              self.statusLabel.text = @"🔄 扫描中...";
              self.statusLabel.textColor = [UIColor colorWithRed:0 green:0.78 blue:0.98 alpha:1];
              [self.activityIndicator startAnimating];
              [self logMessage:[NSString stringWithFormat:@"⏳ 开始扫描 %ld 个IP", (long)ips.count]];

              NSArray *ports = [self.portField.text componentsSeparatedByString:@","];
              NSInteger timeout = [self.timeoutField.text integerValue];
              if (timeout < 1) timeout = 3;
              NSInteger maxThreads = [self.threadField.text integerValue];
              if (maxThreads < 1) maxThreads = 100;

              NSMutableArray *allResults = [NSMutableArray array];
              NSLock *lock = [[NSLock alloc] init];
              dispatch_group_t group = dispatch_group_create();
              dispatch_semaphore_t sem = dispatch_semaphore_create(maxThreads);
              __block NSInteger completed = 0;
              NSInteger total = ips.count * ports.count;

              for (IPInfo *info in ips) {
                  for (NSString *portStr in ports) {
                      NSInteger port = [portStr integerValue];
                      if (port == 0) continue;

                      dispatch_group_enter(group);
                      dispatch_semaphore_wait(sem, DISPATCH_TIME_FOREVER);
                      dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                          [self testIP:info port:port timeout:timeout completion:^(IPInfo *result) {
                              [lock lock];
                              if (result && result.isAvailable) {
                                  [allResults addObject:result];
                              }
                              completed++;
                              [lock unlock];
                              dispatch_semaphore_signal(sem);
                              dispatch_group_leave(group);

                              dispatch_async(dispatch_get_main_queue(), ^{
                                  self.results = [allResults mutableCopy];
                                  [self applyFilter];
                                  [self updateStats];
                                  self.statusLabel.text = [NSString stringWithFormat:@"🔄 扫描中... %lu 个可用", (unsigned long)self.results.count];
                              });
                          }];
                      });
                  }
              }

              dispatch_group_notify(group, dispatch_get_main_queue(), ^{
                  self.isScanning = NO;
                  self.scanBtn.enabled = YES;
                  self.stopBtn.enabled = NO;
                  [self.activityIndicator stopAnimating];
                  self.statusLabel.text = @"✅ 扫描完成";
                  self.statusLabel.textColor = [UIColor colorWithRed:0 green:0.9 blue:0.5 alpha:1];
                  [self logMessage:[NSString stringWithFormat:@"✅ 完成！共 %lu 个可用IP", (unsigned long)self.results.count]];
                  [self updateOutput];
              });
          }

          - (void)testIP:(IPInfo *)info port:(NSInteger)port timeout:(NSInteger)timeout completion:(void(^)(IPInfo *))completion {
              IPInfo *result = [[IPInfo alloc] init];
              result.ip = info.ip;
              result.port = port;
              result.ipVersion = info.ipVersion;

              result.tcpDelay = [self testTCP:info.ip port:port timeout:timeout];

              if (result.tcpDelay > 0) {
                  result.tlsDelay = [self testTLS:info.ip port:port timeout:timeout];
              }

              if (result.tlsDelay > 0 || result.tcpDelay > 0) {
                  NSDictionary *httpResult = [self testHTTP:info.ip port:port timeout:timeout];
                  result.httpDelay = [httpResult[@"delay"] doubleValue];
                  if (httpResult[@"colo"]) {
                      result.colo = httpResult[@"colo"];
                  }
              }

              NSDictionary *fullResult = [self testFull:info.ip port:port timeout:timeout];
              result.fullDelay = [fullResult[@"delay"] doubleValue];
              if (fullResult[@"colo"] && result.colo.length == 0) {
                  result.colo = fullResult[@"colo"];
              }

              NSArray *delays = @[@(result.tcpDelay), @(result.tlsDelay), @(result.httpDelay), @(result.fullDelay)];
              double best = -1;
              for (NSNumber *d in delays) {
                  if ([d doubleValue] > 0) {
                      if (best < 0 || [d doubleValue] < best) {
                          best = [d doubleValue];
                      }
                  }
              }
              result.bestDelay = best;
              result.isAvailable = best > 0;

              if (best > 0) {
                  if (best < 30) result.quality = @"🏆 极速";
                  else if (best < 60) result.quality = @"⭐ 优秀";
                  else if (best < 100) result.quality = @"👍 良好";
                  else if (best < 200) result.quality = @"📶 一般";
                  else result.quality = @"🐢 较慢";
              } else {
                  result.quality = @"❌ 不可用";
              }

              if (result.isAvailable) {
                  NSDictionary *loc = [self getLocation:info.ip];
                  result.country = loc[@"country"] ?: @"";
                  result.city = loc[@"city"] ?: @"";
                  result.isp = loc[@"isp"] ?: @"";
                  result.region = loc[@"region"] ?: @"";
              }

              completion(result);
          }

          - (double)testTCP:(NSString *)ip port:(NSInteger)port timeout:(NSInteger)timeout {
              __block double delay = -1;
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);

              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                  NSDate *start = [NSDate date];
                  int sock = socket(AF_INET, SOCK_STREAM, 0);
                  if (sock < 0) { dispatch_semaphore_signal(sem); return; }

                  struct sockaddr_in addr;
                  memset(&addr, 0, sizeof(addr));
                  addr.sin_family = AF_INET;
                  addr.sin_port = htons(port);

                  if (inet_pton(AF_INET, [ip UTF8String], &addr.sin_addr) <= 0) {
                      close(sock);
                      dispatch_semaphore_signal(sem);
                      return;
                  }

                  struct timeval tv;
                  tv.tv_sec = timeout;
                  tv.tv_usec = 0;
                  setsockopt(sock, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
                  setsockopt(sock, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));

                  if (connect(sock, (struct sockaddr *)&addr, sizeof(addr)) == 0) {
                      delay = [[NSDate date] timeIntervalSinceDate:start] * 1000;
                  }
                  close(sock);
                  dispatch_semaphore_signal(sem);
              });

              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, (timeout + 1) * NSEC_PER_SEC));
              return delay;
          }

          - (double)testTLS:(NSString *)ip port:(NSInteger)port timeout:(NSInteger)timeout {
              __block double delay = -1;
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);

              dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                  NSDate *start = [NSDate date];
                  int sock = socket(AF_INET, SOCK_STREAM, 0);
                  if (sock < 0) { dispatch_semaphore_signal(sem); return; }

                  struct sockaddr_in addr;
                  memset(&addr, 0, sizeof(addr));
                  addr.sin_family = AF_INET;
                  addr.sin_port = htons(port);

                  if (inet_pton(AF_INET, [ip UTF8String], &addr.sin_addr) <= 0) {
                      close(sock);
                      dispatch_semaphore_signal(sem);
                      return;
                  }

                  struct timeval tv;
                  tv.tv_sec = timeout + 2;
                  tv.tv_usec = 0;
                  setsockopt(sock, SOL_SOCKET, SO_RCVTIMEO, &tv, sizeof(tv));
                  setsockopt(sock, SOL_SOCKET, SO_SNDTIMEO, &tv, sizeof(tv));

                  if (connect(sock, (struct sockaddr *)&addr, sizeof(addr)) == 0) {
                      NSString *request = @"GET /cdn-cgi/trace HTTP/1.1\r\nHost: speed.cloudflare.com\r\nConnection: close\r\n\r\n";
                      NSData *requestData = [request dataUsingEncoding:NSUTF8StringEncoding];
                      send(sock, requestData.bytes, requestData.length, 0);
                      char buffer[1024];
                      if (recv(sock, buffer, sizeof(buffer) - 1, 0) > 0) {
                          delay = [[NSDate date] timeIntervalSinceDate:start] * 1000;
                      }
                  }
                  close(sock);
                  dispatch_semaphore_signal(sem);
              });

              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, (timeout + 3) * NSEC_PER_SEC));
              return delay;
          }

          - (NSDictionary *)testHTTP:(NSString *)ip port:(NSInteger)port timeout:(NSInteger)timeout {
              NSString *urlStr = [NSString stringWithFormat:@"https://%@:%ld/cdn-cgi/trace", ip, (long)port];
              NSURL *url = [NSURL URLWithString:urlStr];
              NSDate *start = [NSDate date];

              NSURLSessionConfiguration *cfg = [NSURLSessionConfiguration defaultSessionConfiguration];
              cfg.timeoutIntervalForRequest = timeout;
              cfg.timeoutIntervalForResource = timeout;
              NSURLSession *session = [NSURLSession sessionWithConfiguration:cfg];

              __block NSDictionary *result = @{@"delay": @(-1)};
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);

              [[session dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data && !error) {
                      NSHTTPURLResponse *http = (NSHTTPURLResponse *)response;
                      if (http.statusCode == 200) {
                          double delay = [[NSDate date] timeIntervalSinceDate:start] * 1000;
                          NSString *text = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                          NSString *colo = @"";
                          for (NSString *line in [text componentsSeparatedByString:@"\n"]) {
                              if ([line hasPrefix:@"colo="]) {
                                  colo = [line substringFromIndex:5];
                                  break;
                              }
                          }
                          result = @{@"delay": @(delay), @"colo": colo};
                      }
                  }
                  dispatch_semaphore_signal(sem);
              }] resume];

              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, (timeout + 1) * NSEC_PER_SEC));
              return result;
          }

          - (NSDictionary *)testFull:(NSString *)ip port:(NSInteger)port timeout:(NSInteger)timeout {
              return [self testHTTP:ip port:port timeout:timeout + 1];
          }

          - (NSDictionary *)getLocation:(NSString *)ip {
              NSString *urlStr = [NSString stringWithFormat:@"http://ip-api.com/json/%@?fields=status,country,city,isp,regionName", ip];
              NSURL *url = [NSURL URLWithString:urlStr];

              __block NSDictionary *result = @{};
              dispatch_semaphore_t sem = dispatch_semaphore_create(0);

              [[[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if (json && [json[@"status"] isEqualToString:@"success"]) {
                          result = @{
                              @"country": json[@"country"] ?: @"",
                              @"city": json[@"city"] ?: @"",
                              @"isp": json[@"isp"] ?: @"",
                              @"region": json[@"regionName"] ?: @""
                          };
                      }
                  }
                  dispatch_semaphore_signal(sem);
              }] resume];

              dispatch_semaphore_wait(sem, dispatch_time(DISPATCH_TIME_NOW, 3 * NSEC_PER_SEC));
              return result;
          }

          - (void)stopScan {
              self.isScanning = NO;
              self.scanBtn.enabled = YES;
              self.stopBtn.enabled = NO;
              [self.activityIndicator stopAnimating];
              self.statusLabel.text = @"⏹ 已停止";
              self.statusLabel.textColor = [UIColor yellowColor];
              [self logMessage:@"⏹ 已停止"];
          }

          - (void)filterChanged {
              [self applyFilter];
          }

          - (void)applyFilter {
              NSString *countryFilter = self.filterField.text;
              NSString *portFilter = self.filterPortField.text;

              NSMutableArray *filtered = [NSMutableArray array];
              for (IPInfo *info in self.results) {
                  BOOL match = YES;
                  if (countryFilter.length > 0) {
                      if (![info.country localizedCaseInsensitiveContainsString:countryFilter] &&
                          ![info.region localizedCaseInsensitiveContainsString:countryFilter]) {
                          match = NO;
                      }
                  }
                  if (portFilter.length > 0) {
                      NSInteger port = [portFilter integerValue];
                      if (info.port != port) {
                          match = NO;
                      }
                  }
                  if (match) {
                      [filtered addObject:info];
                  }
              }
              self.filteredResults = filtered;
              [self.tableView reloadData];

              UILabel *countDisplay = [self.view viewWithTag:200];
              if (countDisplay) {
                  countDisplay.text = [NSString stringWithFormat:@"显示 %lu 个", (unsigned long)self.filteredResults.count];
              }
          }

          - (void)updateStats {
              NSInteger total = self.results.count;
              NSInteger available = 0;
              double best = -1;
              double totalDelay = 0;
              NSInteger delayCount = 0;

              for (IPInfo *info in self.results) {
                  if (info.isAvailable) {
                      available++;
                      if (info.bestDelay > 0) {
                          if (best < 0 || info.bestDelay < best) {
                              best = info.bestDelay;
                          }
                          totalDelay += info.bestDelay;
                          delayCount++;
                      }
                  }
              }

              NSString *avgText = delayCount > 0 ? [NSString stringWithFormat:@"%.0f", totalDelay / delayCount] : @"--";
              NSString *bestText = best > 0 ? [NSString stringWithFormat:@"%.0fms", best] : @"--";

              self.countLabel.text = [NSString stringWithFormat:@"📊 总数:%lu 可用:%lu 最佳:%@ 平均:%@ms",
                                      (unsigned long)total, (unsigned long)available, bestText, avgText];
          }

          - (void)updateOutput {
              NSMutableString *outText = [NSMutableString string];
              for (IPInfo *info in self.filteredResults) {
                  if (info.isAvailable) {
                      [outText appendFormat:@"%@:%ld  [%.0fms]  %@  %@  %@\n",
                       info.ip, (long)info.port, info.bestDelay, info.country, info.colo, info.quality];
                  }
              }
              UITextView *outView = [self.view viewWithTag:300];
              outView.text = outText.length > 0 ? outText : @"暂无数据";
              outView.textColor = outText.length > 0 ? [UIColor whiteColor] : [UIColor grayColor];
          }

          - (void)copyResults {
              NSMutableString *text = [NSMutableString string];
              for (IPInfo *info in self.filteredResults) {
                  if (info.isAvailable) {
                      [text appendFormat:@"%@:%ld  [%.0fms]  %@  %@  %@\n",
                       info.ip, (long)info.port, info.bestDelay, info.country, info.colo, info.quality];
                  }
              }
              if (text.length > 0) {
                  [UIPasteboard generalPasteboard].string = text;
                  self.statusLabel.text = @"✅ 已复制";
                  self.statusLabel.textColor = [UIColor colorWithRed:0 green:0.9 blue:0.5 alpha:1];
                  [self logMessage:@"📋 已复制"];
              }
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.filteredResults.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"Cell" forIndexPath:indexPath];
              cell.backgroundColor = [UIColor clearColor];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.textLabel.font = [UIFont systemFontOfSize:11];
              cell.textLabel.numberOfLines = 0;

              if (indexPath.row < self.filteredResults.count) {
                  IPInfo *info = self.filteredResults[indexPath.row];
                  NSString *colo = info.colo.length > 0 ? [NSString stringWithFormat:@"🏢%@", info.colo] : @"";
                  NSString *quality = info.quality ?: @"";
                  cell.textLabel.text = [NSString stringWithFormat:@"%@:%ld  [%.0fms]  %@  %@  %@",
                                         info.ip, (long)info.port, info.bestDelay, info.country, colo, quality];
              }
              return cell;
          }

          - (CGFloat)tableView:(UITableView *)tableView heightForRowAtIndexPath:(NSIndexPath *)indexPath {
              return 32;
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[UINavigationController alloc] initWithRootViewController:[[ViewController alloc] init]];
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"AppDelegate");
              }
          }
          EOF

      - name: 编译
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          cd CloudFlareScan

          clang -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=15.0 \
            -framework UIKit \
            -framework Foundation \
            -framework Network \
            -fobjc-arc \
            -c main.m -o main.o

          clang -arch arm64 \
            -isysroot "$SDK_PATH" \
            -mios-version-min=15.0 \
            -framework UIKit \
            -framework Foundation \
            -framework Network \
            -fobjc-arc \
            main.o -o CloudFlareScan

          cd ..

      - name: 打包
        run: |
          mkdir -p Payload/CloudFlareScan.app
          cp CloudFlareScan/CloudFlareScan Payload/CloudFlareScan.app/

          cat > Payload/CloudFlareScan.app/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP筛选</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
