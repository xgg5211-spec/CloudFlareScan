              [self.resultCopyBtn addTarget:self action:@selector(copyResults) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.resultCopyBtn];

              self.clearBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.clearBtn setTitle:@"🗑 清空" forState:UIControlStateNormal];
              [self.clearBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.clearBtn.backgroundColor = [UIColor colorWithRed:0.4 green:0.4 blue:0.4 alpha:1];
              self.clearBtn.layer.cornerRadius = 6;
              self.clearBtn.frame = CGRectMake(280, 5, 55, 34);
              [self.clearBtn addTarget:self action:@selector(clearAll) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.clearBtn];

              y += 52;

              UIView *filterBg = [[UIView alloc] init];
              filterBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              filterBg.layer.cornerRadius = 8;
              filterBg.frame = CGRectMake(8, y, w, 40);
              [content addSubview:filterBg];

              UILabel *filterLabel = [[UILabel alloc] init];
              filterLabel.text = @"🔍 地区:";
              filterLabel.textColor = [UIColor grayColor];
              filterLabel.font = [UIFont systemFontOfSize:11];
              filterLabel.frame = CGRectMake(10, 8, 45, 24);
              [filterBg addSubview:filterLabel];

              self.filterField = [[UITextField alloc] init];
              self.filterField.placeholder = @"输入地区";
              self.filterField.textColor = [UIColor whiteColor];
              self.filterField.font = [UIFont systemFontOfSize:11];
              self.filterField.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.filterField.layer.cornerRadius = 4;
              self.filterField.frame = CGRectMake(58, 8, 70, 24);
              self.filterField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 24)];
              self.filterField.leftViewMode = UITextFieldViewModeAlways;
              [self.filterField addTarget:self action:@selector(filterChanged) forControlEvents:UIControlEventEditingChanged];
              [filterBg addSubview:self.filterField];

              UILabel *filterPortLabel = [[UILabel alloc] init];
              filterPortLabel.text = @"端口:";
              filterPortLabel.textColor = [UIColor grayColor];
              filterPortLabel.font = [UIFont systemFontOfSize:11];
              filterPortLabel.frame = CGRectMake(140, 8, 35, 24);
              [filterBg addSubview:filterPortLabel];

