name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建源码
        run: |
          mkdir -p CloudFlareScan

          cat > CloudFlareScan/main.swift << 'EOF'
          import UIKit
          import Foundation

          // ===== IP数据模型 =====
          class IPItem: NSObject {
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var colo: String
              init(ip: String, port: Int, delay: Double, country: String, colo: String) {
                  self.ip = ip; self.port = port; self.delay = delay; self.country = country; self.colo = colo
              }
          }

          // ===== 主控制器 =====
          class MainVC: UIViewController, UITableViewDelegate, UITableViewDataSource {
              var results: [IPItem] = []
              var isScanning = false
              var inputTV: UITextView!
              var tableView: UITableView!
              var statusLabel: UILabel!
              var countLabel: UILabel!
              var scanBtn: UIButton!
              var stopBtn: UIButton!
              var importBtn: UIButton!
              var copyBtn: UIButton!
              var portField: UITextField!
              var timeoutField: UITextField!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 0.06, green: 0.08, blue: 0.15, alpha: 1)
                  title = "🚀 优选IP筛选"
                  setupUI()
                  detectISP()
              }

              func setupUI() {
                  let scroll = UIScrollView()
                  scroll.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(scroll)

                  let content = UIView()
                  content.translatesAutoresizingMaskIntoConstraints = false
                  scroll.addSubview(content)

                  NSLayoutConstraint.activate([
                      scroll.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor),
                      scroll.leadingAnchor.constraint(equalTo: view.leadingAnchor),
                      scroll.trailingAnchor.constraint(equalTo: view.trailingAnchor),
                      scroll.bottomAnchor.constraint(equalTo: view.safeAreaLayoutGuide.bottomAnchor),
                      content.topAnchor.constraint(equalTo: scroll.topAnchor),
                      content.leadingAnchor.constraint(equalTo: scroll.leadingAnchor),
                      content.trailingAnchor.constraint(equalTo: scroll.trailingAnchor),
                      content.bottomAnchor.constraint(equalTo: scroll.bottomAnchor),
                      content.widthAnchor.constraint(equalTo: scroll.widthAnchor)
                  ])

                  let w = view.bounds.width - 24
                  var y: CGFloat = 12

                  // 状态
                  statusLabel = UILabel()
                  statusLabel.text = "就绪"
                  statusLabel.textColor = .gray
                  statusLabel.font = .systemFont(ofSize: 12)
                  statusLabel.frame = CGRect(x: 12, y: y, width: 200, height: 20)
                  content.addSubview(statusLabel)

                  let ispLabel = UILabel()
                  ispLabel.text = "📍 检测中..."
                  ispLabel.textColor = UIColor(red: 0, green: 0.78, blue: 0.98, alpha: 1)
                  ispLabel.font = .systemFont(ofSize: 12)
                  ispLabel.textAlignment = .right
                  ispLabel.tag = 100
                  ispLabel.frame = CGRect(x: w - 180, y: y, width: 180, height: 20)
                  content.addSubview(ispLabel)

                  y += 28

                  // 统计
                  countLabel = UILabel()
                  countLabel.text = "总数: 0  可用: 0"
                  countLabel.textColor = .white
                  countLabel.font = .systemFont(ofSize: 14)
                  countLabel.frame = CGRect(x: 12, y: y, width: w, height: 24)
                  content.addSubview(countLabel)

                  y += 32

                  // 输入
                  let inputBg = UIView()
                  inputBg.backgroundColor = UIColor(red: 0.10, green: 0.13, blue: 0.22, alpha: 1)
                  inputBg.layer.cornerRadius = 8
                  inputBg.frame = CGRect(x: 12, y: y, width: w, height: 100)
                  content.addSubview(inputBg)

                  let inputLabel = UILabel()
                  inputLabel.text = "📂 导入IP (每行一个，支持 IP:端口)"
                  inputLabel.textColor = .gray
                  inputLabel.font = .systemFont(ofSize: 11)
                  inputLabel.frame = CGRect(x: 12, y: 6, width: 300, height: 20)
                  inputBg.addSubview(inputLabel)

                  inputTV = UITextView()
                  inputTV.backgroundColor = UIColor(red: 0.06, green: 0.08, blue: 0.15, alpha: 1)
                  inputTV.textColor = .white
                  inputTV.font = .systemFont(ofSize: 12)
                  inputTV.layer.cornerRadius = 4
                  inputTV.text = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0\n104.16.1.0"
                  inputTV.frame = CGRect(x: 8, y: 30, width: inputBg.bounds.width - 16, height: 62)
                  inputBg.addSubview(inputTV)

                  y += 108

                  // 端口和超时
                  let settingBg = UIView()
                  settingBg.backgroundColor = UIColor(red: 0.10, green: 0.13, blue: 0.22, alpha: 1)
                  settingBg.layer.cornerRadius = 8
                  settingBg.frame = CGRect(x: 12, y: y, width: w, height: 44)
                  content.addSubview(settingBg)

                  let portLabel = UILabel()
                  portLabel.text = "端口:"
                  portLabel.textColor = .gray
                  portLabel.font = .systemFont(ofSize: 11)
                  portLabel.frame = CGRect(x: 12, y: 10, width: 40, height: 24)
                  settingBg.addSubview(portLabel)

                  portField = UITextField()
                  portField.text = "443"
                  portField.textColor = .white
                  portField.font = .systemFont(ofSize: 11)
                  portField.backgroundColor = UIColor(red: 0.06, green: 0.08, blue: 0.15, alpha: 1)
                  portField.layer.cornerRadius = 4
                  portField.frame = CGRect(x: 55, y: 10, width: 60, height: 24)
                  portField.leftView = UIView(frame: CGRect(x: 0, y: 0, width: 8, height: 24))
                  portField.leftViewMode = .always
                  portField.keyboardType = .numberPad
                  settingBg.addSubview(portField)

                  let timeoutLabel = UILabel()
                  timeoutLabel.text = "超时:"
                  timeoutLabel.textColor = .gray
                  timeoutLabel.font = .systemFont(ofSize: 11)
                  timeoutLabel.frame = CGRect(x: 130, y: 10, width: 40, height: 24)
                  settingBg.addSubview(timeoutLabel)

                  timeoutField = UITextField()
                  timeoutField.text = "3"
                  timeoutField.textColor = .white
                  timeoutField.font = .systemFont(ofSize: 11)
                  timeoutField.backgroundColor = UIColor(red: 0.06, green: 0.08, blue: 0.15, alpha: 1)
                  timeoutField.layer.cornerRadius = 4
                  timeoutField.frame = CGRect(x: 175, y: 10, width: 40, height: 24)
                  timeoutField.leftView = UIView(frame: CGRect(x: 0, y: 0, width: 8, height: 24))
                  timeoutField.leftViewMode = .always
                  timeoutField.keyboardType = .numberPad
                  settingBg.addSubview(timeoutField)

                  y += 52

                  // 按钮
                  let btnBg = UIView()
                  btnBg.backgroundColor = UIColor(red: 0.10, green: 0.13, blue: 0.22, alpha: 1)
                  btnBg.layer.cornerRadius = 8
                  btnBg.frame = CGRect(x: 12, y: y, width: w, height: 44)
                  content.addSubview(btnBg)

                  scanBtn = UIButton(type: .system)
                  scanBtn.setTitle("▶ 扫描", for: .normal)
                  scanBtn.setTitleColor(.white, for: .normal)
                  scanBtn.backgroundColor = UIColor(red: 0.2, green: 0.5, blue: 0.9, alpha: 1)
                  scanBtn.layer.cornerRadius = 6
                  scanBtn.frame = CGRect(x: 6, y: 5, width: 60, height: 34)
                  scanBtn.addTarget(self, action: #selector(startScan), for: .touchUpInside)
                  btnBg.addSubview(scanBtn)

                  stopBtn = UIButton(type: .system)
                  stopBtn.setTitle("⏹ 停止", for: .normal)
                  stopBtn.setTitleColor(.white, for: .normal)
                  stopBtn.backgroundColor = UIColor(red: 0.8, green: 0.2, blue: 0.2, alpha: 1)
                  stopBtn.layer.cornerRadius = 6
                  stopBtn.frame = CGRect(x: 72, y: 5, width: 50, height: 34)
                  stopBtn.isEnabled = false
                  stopBtn.addTarget(self, action: #selector(stopScan), for: .touchUpInside)
                  btnBg.addSubview(stopBtn)

                  importBtn = UIButton(type: .system)
                  importBtn.setTitle("📥 导入", for: .normal)
                  importBtn.setTitleColor(.white, for: .normal)
                  importBtn.backgroundColor = UIColor(red: 0.2, green: 0.7, blue: 0.3, alpha: 1)
                  importBtn.layer.cornerRadius = 6
                  importBtn.frame = CGRect(x: 128, y: 5, width: 50, height: 34)
                  importBtn.addTarget(self, action: #selector(importIPs), for: .touchUpInside)
                  btnBg.addSubview(importBtn)

                  copyBtn = UIButton(type: .system)
                  copyBtn.setTitle("📋 复制", for: .normal)
                  copyBtn.setTitleColor(.white, for: .normal)
                  copyBtn.backgroundColor = UIColor(red: 0.5, green: 0.3, blue: 0.8, alpha: 1)
                  copyBtn.layer.cornerRadius = 6
                  copyBtn.frame = CGRect(x: 184, y: 5, width: 50, height: 34)
                  copyBtn.addTarget(self, action: #selector(copyResults), for: .touchUpInside)
                  btnBg.addSubview(copyBtn)

                  y += 52

                  // 列表
                  let tableBg = UIView()
                  tableBg.backgroundColor = UIColor(red: 0.10, green: 0.13, blue: 0.22, alpha: 1)
                  tableBg.layer.cornerRadius = 8
                  tableBg.frame = CGRect(x: 12, y: y, width: w, height: 200)
                  content.addSubview(tableBg)

                  let tableLabel = UILabel()
                  tableLabel.text = "📋 可用IP"
                  tableLabel.textColor = .white
                  tableLabel.font = .systemFont(ofSize: 13)
                  tableLabel.frame = CGRect(x: 12, y: 6, width: 200, height: 20)
                  tableBg.addSubview(tableLabel)

                  tableView = UITableView()
                  tableView.backgroundColor = .clear
                  tableView.delegate = self
                  tableView.dataSource = self
                  tableView.separatorStyle = .none
                  tableView.frame = CGRect(x: 0, y: 30, width: tableBg.bounds.width, height: 170)
                  tableView.register(UITableViewCell.self, forCellReuseIdentifier: "Cell")
                  tableBg.addSubview(tableView)

                  y += 208

                  // 输出
                  let outBg = UIView()
                  outBg.backgroundColor = UIColor(red: 0.10, green: 0.13, blue: 0.22, alpha: 1)
                  outBg.layer.cornerRadius = 8
                  outBg.frame = CGRect(x: 12, y: y, width: w, height: 80)
                  content.addSubview(outBg)

                  let outLabel = UILabel()
                  outLabel.text = "📝 输出"
                  outLabel.textColor = .gray
                  outLabel.font = .systemFont(ofSize: 11)
                  outLabel.frame = CGRect(x: 12, y: 4, width: 200, height: 18)
                  outBg.addSubview(outLabel)

                  let outView = UITextView()
                  outView.backgroundColor = UIColor(red: 0.06, green: 0.08, blue: 0.15, alpha: 1)
                  outView.textColor = .gray
                  outView.font = .systemFont(ofSize: 11)
                  outView.layer.cornerRadius = 4
                  outView.tag = 200
                  outView.frame = CGRect(x: 8, y: 26, width: outBg.bounds.width - 16, height: 48)
                  outView.text = "等待扫描..."
                  outBg.addSubview(outView)

                  y += 88

                  content.frame = CGRect(x: 0, y: 0, width: view.bounds.width, height: y + 20)
                  scroll.contentSize = content.frame.size

                  // 点击空白收起键盘
                  let tap = UITapGestureRecognizer(target: self, action: #selector(dismissKeyboard))
                  view.addGestureRecognizer(tap)
              }

              @objc func dismissKeyboard() { view.endEditing(true) }

              // ===== 检测运营商 =====
              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp,country,query") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          DispatchQueue.main.async {
                              let label = self.view.viewWithTag(100) as? UILabel
                              label?.text = "📍 \(json["isp"] as? String ?? "未知")"
                          }
                      }
                  }.resume()
              }

              // ===== 导入 =====
              @objc func importIPs() {
                  results.removeAll()
                  tableView.reloadData()
                  statusLabel.text = "已导入"
                  countLabel.text = "总数: 0  可用: 0"
                  (view.viewWithTag(200) as? UITextView)?.text = "等待扫描..."
                  (view.viewWithTag(200) as? UITextView)?.textColor = .gray
                  view.endEditing(true)
              }

              // ===== 扫描 =====
              @objc func startScan() {
                  let text = inputTV.text ?? ""
                  let lines = text.components(separatedBy: "\n")
                  var ips: [IPItem] = []
                  for line in lines {
                      let trim = line.trimmingCharacters(in: .whitespaces)
                      if trim.isEmpty { continue }
                      let parts = trim.components(separatedBy: ":")
                      let ip = parts[0]
                      var port = 443
                      if parts.count > 1 { port = Int(parts[1]) ?? 443 }
                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: ""))
                      }
                  }
                  guard !ips.isEmpty else { statusLabel.text = "请导入有效IP"; return }

                  results.removeAll()
                  isScanning = true
                  scanBtn.isEnabled = false
                  stopBtn.isEnabled = true
                  statusLabel.text = "扫描中..."

                  let port = Int(portField.text ?? "443") ?? 443
                  let timeout = Int(timeoutField.text ?? "3") ?? 3

                  var allResults: [IPItem] = []
                  let lock = NSLock()
                  let group = DispatchGroup()
                  let semaphore = DispatchSemaphore(value: 50)

                  for ip in ips {
                      group.enter()
                      semaphore.wait()
                      DispatchQueue.global().async {
                          self.checkIP(ip: ip, port: port, timeout: timeout) { result in
                              lock.lock()
                              if let r = result { allResults.append(r) }
                              lock.unlock()
                              semaphore.signal()
                              group.leave()
                              DispatchQueue.main.async {
                                  self.results = allResults
                                  self.tableView.reloadData()
                                  self.countLabel.text = "总数: \(ips.count)  可用: \(allResults.count)"
                                  self.statusLabel.text = "扫描中... \(allResults.count) 个"
                              }
                          }
                      }
                  }

                  group.notify(queue: .main) {
                      self.isScanning = false
                      self.scanBtn.isEnabled = true
                      self.stopBtn.isEnabled = false
                      self.statusLabel.text = "✅ 完成！共 \(allResults.count) 个"
                      self.updateOutput()
                  }
              }

              // ===== 检查IP =====
              func checkIP(ip: IPItem, port: Int, timeout: Int, completion: @escaping (IPItem?) -> Void) {
                  let urlStr = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlStr) else { completion(nil); return }
                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  session.dataTask(with: url) { data, response, _ in
                      guard let data = data, let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          completion(nil); return
                      }
                      let delay = Date().timeIntervalSince(start) * 1000
                      let text = String(data: data, encoding: .utf8) ?? ""
                      var colo = ""
                      for line in text.components(separatedBy: "\n") {
                          if line.hasPrefix("colo=") {
                              colo = String(line.dropFirst(5))
                              break
                          }
                      }
                      let result = IPItem(ip: ip.ip, port: port, delay: delay, country: "", colo: colo)
                      // 获取地区
                      let locUrl = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country")!
                      URLSession.shared.dataTask(with: locUrl) { d, _, _ in
                          if let d = d, let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                             let country = json["country"] as? String {
                              result.country = country
                          }
                          completion(result)
                      }.resume()
                  }.resume()
              }

              // ===== 停止 =====
              @objc func stopScan() {
                  isScanning = false
                  scanBtn.isEnabled = true
                  stopBtn.isEnabled = false
                  statusLabel.text = "已停止"
              }

              // ===== 更新输出 =====
              func updateOutput() {
                  let outView = view.viewWithTag(200) as? UITextView
                  var text = ""
                  for item in results {
                      text += "\(item.ip):\(item.port)  [\(String(format: "%.0f", item.delay))ms]  \(item.country)  \(item.colo)\n"
                  }
                  outView?.text = text.isEmpty ? "暂无数据" : text
                  outView?.textColor = text.isEmpty ? .gray : .white
              }

              // ===== 复制 =====
              @objc func copyResults() {
                  var text = ""
                  for item in results {
                      text += "\(item.ip):\(item.port)\n"
                  }
                  if !text.isEmpty {
                      UIPasteboard.general.string = text
                      statusLabel.text = "✅ 已复制"
                  }
              }

              // ===== TableView =====
              func tableView(_ tableView: UITableView, numberOfRowsInSection section: Int) -> Int {
                  return results.count
              }

              func tableView(_ tableView: UITableView, cellForRowAt indexPath: IndexPath) -> UITableViewCell {
                  let cell = tableView.dequeueReusableCell(withIdentifier: "Cell", for: indexPath)
                  cell.backgroundColor = .clear
                  cell.textLabel?.textColor = .white
                  cell.textLabel?.font = .systemFont(ofSize: 11)
                  let item = results[indexPath.row]
                  cell.textLabel?.text = "\(item.ip):\(item.port)  [\(String(format: "%.0f", item.delay))ms]  \(item.country)  \(item.colo)"
                  return cell
              }

              func tableView(_ tableView: UITableView, heightForRowAt indexPath: IndexPath) -> CGFloat {
                  return 30
              }
          }

          // ===== App入口 =====
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UINavigationController(rootViewController: MainVC())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 编译
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd CloudFlareScan

          swiftc -target arm64-apple-ios15.0 \
            -sdk "$SDK" \
            -framework UIKit \
            -framework Foundation \
            -parse-as-library \
            -o CloudFlareScan main.swift

          cd ..

      - name: 打包
        run: |
          mkdir -p Payload/CloudFlareScan.app
          cp CloudFlareScan/CloudFlareScan Payload/CloudFlareScan.app/
          cp CloudFlareScan/Info.plist Payload/CloudFlareScan.app/

          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
