name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建项目
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          cat > CloudFlareScan/AppDelegate.m << 'EOF'
          #import <UIKit/UIKit.h>

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              UIViewController *vc = [[UIViewController alloc] init];
              vc.view.backgroundColor = [UIColor blackColor];
              vc.title = @"优选IP";
              UILabel *label = [[UILabel alloc] init];
              label.text = @"CloudFlare 优选IP\n点击扫描开始";
              label.numberOfLines = 0;
              label.textAlignment = NSTextAlignmentCenter;
              label.textColor = [UIColor whiteColor];
              label.font = [UIFont systemFontOfSize:20];
              label.frame = CGRectMake(0, 0, 300, 80);
              label.center = vc.view.center;
              [vc.view addSubview:label];
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"AppDelegate");
              }
          }
          EOF

          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  Z100000001 /* AppDelegate.m in Sources */ = {isa = PBXBuildFile; fileRef = Z100000002 /* AppDelegate.m */; };
                  Z100000002 /* AppDelegate.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = AppDelegate.m; sourceTree = "<group>"; };
                  Z100000003 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  Z100000004 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  Z100000005 = {isa = PBXGroup; children = (Z100000006, Z100000007,); sourceTree = "<group>"; };
                  Z100000006 /* CloudFlareScan */ = {isa = PBXGroup; children = (Z100000002, Z100000003,); path = CloudFlareScan; sourceTree = "<group>"; };
                  Z100000007 /* Products */ = {isa = PBXGroup; children = (Z100000004,); name = Products; sourceTree = "<group>"; };
                  Z100000008 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = Z100000009; buildPhases = (Z100000010, Z100000011,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = Z100000004; productType = "com.apple.product-type.application"; };
                  Z100000012 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {Z100000008 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = Z100000013; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = Z100000005; productRefGroup = Z100000007; projectDirPath = ""; projectRoot = ""; targets = (Z100000008,); };
                  Z100000011 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
                  Z100000010 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (Z100000001,); runOnlyForDeploymentPostprocessing = 0; };
                  Z100000014 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  Z100000015 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  Z100000016 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  Z100000017 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  Z100000009 = {isa = XCConfigurationList; buildConfigurations = (Z100000016, Z100000017,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  Z100000013 = {isa = XCConfigurationList; buildConfigurations = (Z100000014, Z100000015,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = Z100000012;
          }
          EOF

      - name: 编译
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
