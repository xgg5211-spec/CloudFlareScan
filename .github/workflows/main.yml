name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建项目
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj

          cat > CloudFlareScan/App.swift << 'EOF'
          import SwiftUI

          @main
          struct CloudFlareScanApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          struct IPItem: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var colo: String
          }

          class ScanManager: ObservableObject {
              @Published var results: [IPItem] = []
              @Published var isScanning = false
              @Published var statusText = "就绪"
              @Published var availableCount = 0
              @Published var bestDelay: Double = 0
              @Published var detectedISP: String = "检测中..."
              @Published var detectedIP: String = "检测中..."
              @Published var detectedCountry: String = "检测中..."
              @Published var inputText: String = ""
              @Published var selectedPort: Int = 443
              @Published var timeoutValue: Int = 3
              @Published var filterText: String = ""

              let ports = [443, 2053, 2083, 2087, 2096, 8443]

              func detectISP() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp,country,query") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          DispatchQueue.main.async {
                              self.detectedISP = json["isp"] as? String ?? "未知"
                              self.detectedIP = json["query"] as? String ?? "未知"
                              self.detectedCountry = json["country"] as? String ?? "未知"
                          }
                      }
                  }.resume()
              }

              func importIPs() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var list: [IPItem] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          list.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: ""))
                      }
                  }
                  results = []
                  availableCount = 0
                  bestDelay = 0
                  statusText = "已导入 \(list.count) 个IP"
              }

              func startScan() {
                  let lines = inputText.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var ips: [IPItem] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPItem(ip: ip, port: port, delay: 0, country: "", colo: ""))
                      }
                  }

                  guard !ips.isEmpty else {
                      statusText = "请导入IP"
                      return
                  }

                  isScanning = true
                  results = []
                  availableCount = 0
                  bestDelay = 0
                  statusText = "扫描中..."

                  let port = selectedPort
                  let timeout = timeoutValue
                  var allResults: [IPItem] = []
                  let lock = NSLock()
                  let group = DispatchGroup()
                  let semaphore = DispatchSemaphore(value: 50)

                  for ip in ips {
                      group.enter()
                      semaphore.wait()
                      DispatchQueue.global().async {
                          self.checkIP(ip: ip, port: port, timeout: timeout) { result in
                              lock.lock()
                              if let r = result {
                                  allResults.append(r)
                              }
                              lock.unlock()
                              semaphore.signal()
                              group.leave()

                              DispatchQueue.main.async {
                                  let available = allResults.filter { $0.delay > 0 }
                                  self.results = available
                                  self.availableCount = available.count
                                  let delays = available.map { $0.delay }
                                  if !delays.isEmpty {
                                      self.bestDelay = delays.min() ?? 0
                                  }
                                  self.statusText = "扫描中... \(available.count) 个可用"
                              }
                          }
                      }
                  }

                  group.notify(queue: .main) {
                      self.isScanning = false
                      let available = allResults.filter { $0.delay > 0 }
                      self.results = available
                      self.availableCount = available.count
                      self.statusText = "✅ 完成！共 \(available.count) 个可用IP"
                  }
              }

              func checkIP(ip: IPItem, port: Int, timeout: Int, completion: @escaping (IPItem?) -> Void) {
                  let urlStr = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlStr) else { completion(nil); return }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  session.dataTask(with: url) { data, response, _ in
                      guard let data = data, let http = response as? HTTPURLResponse, http.statusCode == 200 else {
                          completion(nil)
                          return
                      }

                      let delay = Date().timeIntervalSince(start) * 1000
                      let text = String(data: data, encoding: .utf8) ?? ""
                      var colo = ""
                      for line in text.split(separator: "\n") {
                          if line.hasPrefix("colo=") {
                              colo = String(line.dropFirst(5))
                              break
                          }
                      }

                      var result = ip
                      result.port = port
                      result.delay = delay
                      result.colo = colo

                      let locUrl = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country")!
                      URLSession.shared.dataTask(with: locUrl) { d, _, _ in
                          if let d = d,
                             let json = try? JSONSerialization.jsonObject(with: d) as? [String: Any],
                             let country = json["country"] as? String {
                              result.country = country
                          }
                          completion(result)
                      }.resume()
                  }.resume()
              }

              func stopScan() {
                  isScanning = false
                  statusText = "已停止"
              }

              func copyIPs() {
                  let text = results.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制"
              }

              func copyDetails() {
                  let text = results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  statusText = "✅ 已复制详情"
              }

              var filteredResults: [IPItem] {
                  if filterText.isEmpty { return results }
                  return results.filter {
                      $0.country.localizedCaseInsensitiveContains(filterText) ||
                      $0.colo.localizedCaseInsensitiveContains(filterText)
                  }
              }

              var outputText: String {
                  results.map { "\($0.ip):\($0.port)  [\(String(format: "%.0f", $0.delay))ms]  \($0.country)  \($0.colo)" }.joined(separator: "\n")
              }
          }

          struct ContentView: View {
              @StateObject private var manager = ScanManager()
              @State private var alertMsg = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color(red: 0.06, green: 0.08, blue: 0.15).ignoresSafeArea()

                          ScrollView {
                              VStack(spacing: 10) {
                                  // 标题
                                  HStack {
                                      Text("🚀 优选IP筛选")
                                          .font(.title2)
                                          .fontWeight(.bold)
                                          .foregroundColor(.white)
                                      Spacer()
                                      if manager.isScanning {
                                          ProgressView().scaleEffect(0.7)
                                      }
                                  }

                                  // 运营商信息
                                  HStack {
                                      Text("📶 \(manager.detectedISP)")
                                          .font(.caption)
                                          .foregroundColor(.blue)
                                      Spacer()
                                      Text("📍 \(manager.detectedCountry)")
                                          .font(.caption)
                                          .foregroundColor(.gray)
                                      Text("🆔 \(manager.detectedIP)")
                                          .font(.caption)
                                          .foregroundColor(.gray)
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 6)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(8)

                                  // 统计
                                  HStack(spacing: 8) {
                                      StatView(label: "可用", value: "\(manager.availableCount)", color: .green)
                                      StatView(label: "最佳", value: manager.bestDelay > 0 ? String(format: "%.0fms", manager.bestDelay) : "--", color: .orange)
                                      Spacer()
                                      Text(manager.statusText).font(.caption2).foregroundColor(.gray)
                                  }
                                  .padding(8)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)

                                  // 导入
                                  VStack(alignment: .leading, spacing: 4) {
                                      HStack {
                                          Text("📂 导入IP (每行一个)").font(.caption).foregroundColor(.gray)
                                          Spacer()
                                          Picker("端口", selection: $manager.selectedPort) {
                                              ForEach(manager.ports, id: \.self) { Text("\($0)").tag($0) }
                                          }
                                          .pickerStyle(MenuPickerStyle())
                                          .frame(width: 70)
                                          .tint(.blue)
                                      }
                                      TextEditor(text: $manager.inputText)
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 70)
                                          .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                          .cornerRadius(6)
                                  }
                                  .padding(10)
                                  .background(Color(red: 0.10, green: 0.13, blue: 0.22))
                                  .cornerRadius(10)

                                  // 按钮
                                  HStack(spacing: 6) {
                                      Button("📥 导入") {
                                          manager.importIPs()
                                          alertMsg = "已导入"
                                      }
                                      .buttonStyle(TechButton(color: .blue))

                                      Button("▶ 开始") {
                                          manager.startScan()
                                      }
                                      .buttonStyle(TechButton(color: .blue))
                                      .disabled(manager.isScanning)

                                      Button("⏹ 停止") {
                                          manager.stopScan()
                                      }
                                      .buttonStyle(TechButton(color: .red))
                                      .disabled(!manager.isScanning)

                                      Button("📋 复制") {
                                          manager.copyIPs()
                                          alertMsg = "已复制"
                                      }
                                      .buttonStyle(TechButton(color: .purple))
                                      .disabled(manager.results.isEmpty)

                                      Button("📄 详情") {
                                          manager.copyDetails()
                                          alertMsg = "已复制详情"
                                      }
                                      .buttonStyle(TechButton(color: .green))
                                      .disabled(manager.results.isEmpty)

                                      Button("🗑 清空") {
                                          manager.results = []
                                          manager.availableCount = 0
                                          manager.bestDelay = 0
                                          alertMsg = "已清空"
                                      }
                                      .buttonStyle(TechButton(color: .gray))
                                      .disabled(manager.results.isEmpty)
                                  }

                                  // 筛选
                                  HStack {
                                      Text("🔍 地区:").font(.caption2).foregroundColor(.gray)
                                      TextField("筛选地区", text: $manager.filterText)
                                          .textFieldStyle(RoundedBorderTextFieldStyle())
                                          .font(.caption)
                                          .frame(width: 100)

                                      Spacer()
                                      Text("显示 \(manager.filteredResults.count) 个")
                                          .font(.caption2)
                                          .foregroundColor(.blue)
                                  }

                                  // 列表
                                  List(manager.filteredResults) { ip in
                                      HStack {
                                          Text(ip.ip).font(.system(.caption, design: .monospaced)).foregroundColor(.white)
                                          Text(":\(ip.port)").font(.caption2).foregroundColor(.gray)
                                          Spacer()
                                          Text("\(String(format: "%.0f", ip.delay))ms")
                                              .font(.caption).fontWeight(.bold)
                                              .foregroundColor(ip.delay < 50 ? .green : ip.delay < 100 ? .orange : .red)
                                          if !ip.colo.isEmpty { Text("🏢\(ip.colo)").font(.caption2).foregroundColor(.blue) }
                                          Text("📍\(ip.country)").font(.caption2).foregroundColor(.gray)
                                      }
                                      .padding(.vertical, 2)
                                  }
                                  .listStyle(.plain)
                                  .scrollContentBackground(.hidden)
                                  .frame(height: 180)

                                  // 输出
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text("📝 输出").font(.caption).foregroundColor(.gray)
                                      TextEditor(text: .constant(manager.outputText))
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 50)
                                          .background(Color(red: 0.06, green: 0.08, blue: 0.15))
                                          .cornerRadius(6)
                                  }
                              }
                              .padding(.horizontal, 12)
                              .padding(.bottom, 16)
                          }
                      }
                      .navigationTitle("")
                      .navigationBarTitleDisplayMode(.inline)
                      .alert(alertMsg, isPresented: .constant(!alertMsg.isEmpty)) {
                          Button("确定") { alertMsg = "" }
                      }
                      .onAppear {
                          manager.detectISP()
                          manager.inputText = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0"
                      }
                  }
              }
          }

          struct StatView: View {
              let label: String
              let value: String
              let color: Color

              var body: some View {
                  VStack(spacing: 0) {
                      Text(label).font(.caption2).foregroundColor(.gray)
                      Text(value).font(.subheadline).fontWeight(.semibold).foregroundColor(color)
                  }
                  .frame(minWidth: 50)
              }
          }

          struct TechButton: ButtonStyle {
              let color: Color

              func makeBody(configuration: Configuration) -> some View {
                  configuration.label
                      .font(.caption)
                      .padding(.horizontal, 10)
                      .padding(.vertical, 6)
                      .background(color.opacity(0.15))
                      .foregroundColor(color)
                      .cornerRadius(6)
                      .overlay(RoundedRectangle(cornerRadius: 6).stroke(color.opacity(0.3), lineWidth: 0.5))
              }
          }
          EOF

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 创建项目文件
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  D100000001 /* App.swift in Sources */ = {isa = PBXBuildFile; fileRef = D100000002 /* App.swift */; };
                  D100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = D100000004 /* ContentView.swift */; };
                  D100000002 /* App.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>"; };
                  D100000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  D100000005 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  D100000006 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  D100000007 = {isa = PBXGroup; children = (D100000008, D100000009,); sourceTree = "<group>"; };
                  D100000008 /* CloudFlareScan */ = {isa = PBXGroup; children = (D100000002, D100000004, D100000005,); path = CloudFlareScan; sourceTree = "<group>"; };
                  D100000009 /* Products */ = {isa = PBXGroup; children = (D100000006,); name = Products; sourceTree = "<group>"; };
                  D100000010 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = D100000011; buildPhases = (D100000012, D100000013,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = D100000006; productType = "com.apple.product-type.application"; };
                  D100000014 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {D100000010 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = D100000015; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = D100000007; productRefGroup = D100000009; projectDirPath = ""; projectRoot = ""; targets = (D100000010,); };
                  D100000013 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
                  D100000012 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (D100000001, D100000003,); runOnlyForDeploymentPostprocessing = 0; };
                  D100000016 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  D100000017 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  D100000018 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  D100000019 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  D100000011 = {isa = XCConfigurationList; buildConfigurations = (D100000018, D100000019,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  D100000015 = {isa = XCConfigurationList; buildConfigurations = (D100000016, D100000017,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = D100000014;
          }
          EOF

      - name: 编译
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
