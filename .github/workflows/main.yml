              self.filterPortField.placeholder = @"443";
              self.filterPortField.textColor = [UIColor whiteColor];
              self.filterPortField.font = [UIFont systemFontOfSize:11];
              self.filterPortField.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.filterPortField.layer.cornerRadius = 4;
              self.filterPortField.frame = CGRectMake(178, 8, 50, 24);
              self.filterPortField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 24)];
              self.filterPortField.leftViewMode = UITextFieldViewModeAlways;
              [self.filterPortField addTarget:self action:@selector(filterChanged) forControlEvents:UIControlEventEditingChanged];
              [filterBg addSubview:self.filterPortField];

              UILabel *countDisplay = [[UILabel alloc] init];
              countDisplay.text = @"显示 0 个";
              countDisplay.textColor = [UIColor colorWithRed:0 green:0.78 blue:0.98 alpha:1];
              countDisplay.font = [UIFont systemFontOfSize:11];
              countDisplay.tag = 200;
              countDisplay.frame = CGRectMake(w - 100, 8, 90, 24);
              [filterBg addSubview:countDisplay];

              y += 48;

