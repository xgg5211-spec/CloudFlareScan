              [settingBg addSubview:threadLabel];

              self.threadField = [[UITextField alloc] init];
              self.threadField.text = @"100";
              self.threadField.textColor = [UIColor whiteColor];
              self.threadField.font = [UIFont systemFontOfSize:11];
              self.threadField.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.threadField.layer.cornerRadius = 4;
              self.threadField.frame = CGRectMake(62, 44, 45, 24);
              self.threadField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 24)];
              self.threadField.leftViewMode = UITextFieldViewModeAlways;
              [settingBg addSubview:self.threadField];

              UILabel *strictLabel = [[UILabel alloc] init];
              strictLabel.text = @"🔒 TLS:";
              strictLabel.textColor = [UIColor grayColor];
              strictLabel.font = [UIFont systemFontOfSize:11];
              strictLabel.frame = CGRectMake(125, 44, 40, 24);
              [settingBg addSubview:strictLabel];

              UISwitch *strictSwitch = [[UISwitch alloc] init];
              strictSwitch.on = NO;
              strictSwitch.frame = CGRectMake(168, 40, 50, 32);
              [strictSwitch addTarget:self action:@selector(toggleStrictMode:) forControlEvents:UIControlEventValueChanged];
              [settingBg addSubview:strictSwitch];

              self.activityIndicator = [[UIActivityIndicatorView alloc] initWithActivityIndicatorStyle:UIActivityIndicatorViewStyleMedium];
              self.activityIndicator.color = [UIColor whiteColor];
              self.activityIndicator.frame = CGRectMake(230, 42, 30, 30);
              [settingBg addSubview:self.activityIndicator];

              y += 88;

              UIView *btnBg = [[UIView alloc] init];
              btnBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
