name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建源码
        run: |
          mkdir -p CloudFlareScan

          cat > CloudFlareScan/main.m << 'EOF'
          #import <UIKit/UIKit.h>

          // ===== IP模型 =====
          @interface IPItem : NSObject
          @property (nonatomic, strong) NSString *ip;
          @property (nonatomic, assign) NSInteger port;
          @property (nonatomic, assign) double delay;
          @property (nonatomic, strong) NSString *country;
          @property (nonatomic, strong) NSString *colo;
          @end
          @implementation IPItem
          @end

          // ===== 主控制器 =====
          @interface MainVC : UIViewController <UITableViewDelegate, UITableViewDataSource>
          @property (nonatomic, strong) NSMutableArray *results;
          @property (nonatomic, strong) UITextView *inputTV;
          @property (nonatomic, strong) UITableView *tableView;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UILabel *countLabel;
          @property (nonatomic, strong) UIButton *scanBtn;
          @property (nonatomic, strong) UIButton *stopBtn;
          @property (nonatomic, strong) UIButton *importBtn;
          @property (nonatomic, strong) UIButton *copyBtn;
          @property (nonatomic, strong) UITextField *portField;
          @property (nonatomic, strong) UITextField *timeoutField;
          @property (nonatomic, assign) BOOL isScanning;
          @end

          @implementation MainVC

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.title = @"🚀 优选IP筛选";
              self.results = [NSMutableArray array];
              [self setupUI];
              [self detectISP];
          }

          - (void)setupUI {
              UIScrollView *scroll = [[UIScrollView alloc] init];
              scroll.translatesAutoresizingMaskIntoConstraints = NO;
              [self.view addSubview:scroll];

              UIView *content = [[UIView alloc] init];
              content.translatesAutoresizingMaskIntoConstraints = NO;
              [scroll addSubview:content];

              [NSLayoutConstraint activateConstraints:@[
                  [scroll.topAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.topAnchor],
                  [scroll.leadingAnchor constraintEqualToAnchor:self.view.leadingAnchor],
                  [scroll.trailingAnchor constraintEqualToAnchor:self.view.trailingAnchor],
                  [scroll.bottomAnchor constraintEqualToAnchor:self.view.safeAreaLayoutGuide.bottomAnchor],
                  [content.topAnchor constraintEqualToAnchor:scroll.topAnchor],
                  [content.leadingAnchor constraintEqualToAnchor:scroll.leadingAnchor],
                  [content.trailingAnchor constraintEqualToAnchor:scroll.trailingAnchor],
                  [content.bottomAnchor constraintEqualToAnchor:scroll.bottomAnchor],
                  [content.widthAnchor constraintEqualToAnchor:scroll.widthAnchor]
              ]];

              CGFloat w = self.view.bounds.size.width - 24;
              CGFloat y = 12;

              // 状态
              self.statusLabel = [[UILabel alloc] init];
              self.statusLabel.text = @"就绪";
              self.statusLabel.textColor = [UIColor grayColor];
              self.statusLabel.font = [UIFont systemFontOfSize:12];
              self.statusLabel.frame = CGRectMake(12, y, 200, 20);
              [content addSubview:self.statusLabel];

              UILabel *ispLabel = [[UILabel alloc] init];
              ispLabel.text = @"📍 检测中...";
              ispLabel.textColor = [UIColor colorWithRed:0 green:0.78 blue:0.98 alpha:1];
              ispLabel.font = [UIFont systemFontOfSize:12];
              ispLabel.textAlignment = NSTextAlignmentRight;
              ispLabel.tag = 100;
              ispLabel.frame = CGRectMake(w - 180, y, 180, 20);
              [content addSubview:ispLabel];

              y += 28;

              // 统计
              self.countLabel = [[UILabel alloc] init];
              self.countLabel.text = @"总数: 0  可用: 0";
              self.countLabel.textColor = [UIColor whiteColor];
              self.countLabel.font = [UIFont systemFontOfSize:14];
              self.countLabel.frame = CGRectMake(12, y, w, 24);
              [content addSubview:self.countLabel];

              y += 32;

              // 输入
              UIView *inputBg = [[UIView alloc] init];
              inputBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              inputBg.layer.cornerRadius = 8;
              inputBg.frame = CGRectMake(12, y, w, 100);
              [content addSubview:inputBg];

              UILabel *inputLabel = [[UILabel alloc] init];
              inputLabel.text = @"📂 导入IP (每行一个)";
              inputLabel.textColor = [UIColor grayColor];
              inputLabel.font = [UIFont systemFontOfSize:11];
              inputLabel.frame = CGRectMake(12, 6, 200, 20);
              [inputBg addSubview:inputLabel];

              self.inputTV = [[UITextView alloc] init];
              self.inputTV.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.inputTV.textColor = [UIColor whiteColor];
              self.inputTV.font = [UIFont systemFontOfSize:12];
              self.inputTV.layer.cornerRadius = 4;
              self.inputTV.text = @"1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0";
              self.inputTV.frame = CGRectMake(8, 30, inputBg.bounds.size.width - 16, 62);
              [inputBg addSubview:self.inputTV];

              y += 108;

              // 设置
              UIView *setBg = [[UIView alloc] init];
              setBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              setBg.layer.cornerRadius = 8;
              setBg.frame = CGRectMake(12, y, w, 44);
              [content addSubview:setBg];

              UILabel *portLabel = [[UILabel alloc] init];
              portLabel.text = @"端口:";
              portLabel.textColor = [UIColor grayColor];
              portLabel.font = [UIFont systemFontOfSize:11];
              portLabel.frame = CGRectMake(12, 10, 40, 24);
              [setBg addSubview:portLabel];

              self.portField = [[UITextField alloc] init];
              self.portField.text = @"443";
              self.portField.textColor = [UIColor whiteColor];
              self.portField.font = [UIFont systemFontOfSize:11];
              self.portField.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.portField.layer.cornerRadius = 4;
              self.portField.frame = CGRectMake(55, 10, 60, 24);
              self.portField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 24)];
              self.portField.leftViewMode = UITextFieldViewModeAlways;
              [setBg addSubview:self.portField];

              UILabel *timeoutLabel = [[UILabel alloc] init];
              timeoutLabel.text = @"超时:";
              timeoutLabel.textColor = [UIColor grayColor];
              timeoutLabel.font = [UIFont systemFontOfSize:11];
              timeoutLabel.frame = CGRectMake(130, 10, 40, 24);
              [setBg addSubview:timeoutLabel];

              self.timeoutField = [[UITextField alloc] init];
              self.timeoutField.text = @"3";
              self.timeoutField.textColor = [UIColor whiteColor];
              self.timeoutField.font = [UIFont systemFontOfSize:11];
              self.timeoutField.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              self.timeoutField.layer.cornerRadius = 4;
              self.timeoutField.frame = CGRectMake(175, 10, 40, 24);
              self.timeoutField.leftView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 8, 24)];
              self.timeoutField.leftViewMode = UITextFieldViewModeAlways;
              [setBg addSubview:self.timeoutField];

              y += 52;

              // 按钮
              UIView *btnBg = [[UIView alloc] init];
              btnBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              btnBg.layer.cornerRadius = 8;
              btnBg.frame = CGRectMake(12, y, w, 44);
              [content addSubview:btnBg];

              self.scanBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.scanBtn setTitle:@"▶ 扫描" forState:UIControlStateNormal];
              [self.scanBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.scanBtn.backgroundColor = [UIColor colorWithRed:0.2 green:0.5 blue:0.9 alpha:1];
              self.scanBtn.layer.cornerRadius = 6;
              self.scanBtn.frame = CGRectMake(6, 5, 60, 34);
              [self.scanBtn addTarget:self action:@selector(onScan) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.scanBtn];

              self.stopBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.stopBtn setTitle:@"⏹ 停止" forState:UIControlStateNormal];
              [self.stopBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.stopBtn.backgroundColor = [UIColor colorWithRed:0.8 green:0.2 blue:0.2 alpha:1];
              self.stopBtn.layer.cornerRadius = 6;
              self.stopBtn.frame = CGRectMake(72, 5, 50, 34);
              self.stopBtn.enabled = NO;
              [self.stopBtn addTarget:self action:@selector(onStop) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.stopBtn];

              self.importBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.importBtn setTitle:@"📥 导入" forState:UIControlStateNormal];
              [self.importBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.importBtn.backgroundColor = [UIColor colorWithRed:0.2 green:0.7 blue:0.3 alpha:1];
              self.importBtn.layer.cornerRadius = 6;
              self.importBtn.frame = CGRectMake(128, 5, 50, 34);
              [self.importBtn addTarget:self action:@selector(onImport) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.importBtn];

              self.copyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.copyBtn setTitle:@"📋 复制" forState:UIControlStateNormal];
              [self.copyBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.copyBtn.backgroundColor = [UIColor colorWithRed:0.5 green:0.3 blue:0.8 alpha:1];
              self.copyBtn.layer.cornerRadius = 6;
              self.copyBtn.frame = CGRectMake(184, 5, 50, 34);
              [self.copyBtn addTarget:self action:@selector(onCopy) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.copyBtn];

              y += 52;

              // 列表
              UIView *tableBg = [[UIView alloc] init];
              tableBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              tableBg.layer.cornerRadius = 8;
              tableBg.frame = CGRectMake(12, y, w, 200);
              [content addSubview:tableBg];

              UILabel *tableLabel = [[UILabel alloc] init];
              tableLabel.text = @"📋 可用IP";
              tableLabel.textColor = [UIColor whiteColor];
              tableLabel.font = [UIFont systemFontOfSize:13];
              tableLabel.frame = CGRectMake(12, 6, 200, 20);
              [tableBg addSubview:tableLabel];

              self.tableView = [[UITableView alloc] init];
              self.tableView.backgroundColor = [UIColor clearColor];
              self.tableView.delegate = self;
              self.tableView.dataSource = self;
              self.tableView.separatorStyle = UITableViewCellSeparatorStyleNone;
              self.tableView.frame = CGRectMake(0, 30, tableBg.bounds.size.width, 170);
              [self.tableView registerClass:[UITableViewCell class] forCellReuseIdentifier:@"Cell"];
              [tableBg addSubview:self.tableView];

              y += 208;

              // 输出
              UIView *outBg = [[UIView alloc] init];
              outBg.backgroundColor = [UIColor colorWithRed:0.10 green:0.13 blue:0.22 alpha:1];
              outBg.layer.cornerRadius = 8;
              outBg.frame = CGRectMake(12, y, w, 80);
              [content addSubview:outBg];

              UILabel *outLabel = [[UILabel alloc] init];
              outLabel.text = @"📝 输出";
              outLabel.textColor = [UIColor grayColor];
              outLabel.font = [UIFont systemFontOfSize:11];
              outLabel.frame = CGRectMake(12, 4, 200, 18);
              [outBg addSubview:outLabel];

              UITextView *outView = [[UITextView alloc] init];
              outView.backgroundColor = [UIColor colorWithRed:0.06 green:0.08 blue:0.15 alpha:1];
              outView.textColor = [UIColor grayColor];
              outView.font = [UIFont systemFontOfSize:11];
              outView.layer.cornerRadius = 4;
              outView.tag = 200;
              outView.frame = CGRectMake(8, 26, outBg.bounds.size.width - 16, 48);
              outView.text = @"等待扫描...";
              [outBg addSubview:outView];

              y += 88;

              content.frame = CGRectMake(0, 0, self.view.bounds.size.width, y + 20);
              scroll.contentSize = content.frame.size;

              UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(hideKeyboard)];
              [self.view addGestureRecognizer:tap];
          }

          - (void)hideKeyboard { [self.view endEditing:YES]; }

          // ===== 检测运营商 =====
          - (void)detectISP {
              NSURL *url = [NSURL URLWithString:@"http://ip-api.com/json/?fields=isp"];
              [[[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if (json[@"isp"]) {
                          dispatch_async(dispatch_get_main_queue(), ^{
                              UILabel *l = [self.view viewWithTag:100];
                              l.text = [NSString stringWithFormat:@"📍 %@", json[@"isp"]];
                          });
                      }
                  }
              }] resume];
          }

          // ===== 导入 =====
          - (void)onImport {
              [self.results removeAllObjects];
              [self.tableView reloadData];
              self.statusLabel.text = @"已导入";
              self.countLabel.text = @"总数: 0  可用: 0";
              UITextView *out = [self.view viewWithTag:200];
              out.text = @"等待扫描...";
              out.textColor = [UIColor grayColor];
              [self.view endEditing:YES];

              NSArray *lines = [self.inputTV.text componentsSeparatedByString:@"\n"];
              NSInteger count = 0;
              for (NSString *line in lines) {
                  if ([[line stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]] length] > 0) count++;
              }
              self.statusLabel.text = [NSString stringWithFormat:@"已导入 %ld 个IP", (long)count];
          }

          // ===== 扫描 =====
          - (void)onScan {
              NSArray *lines = [self.inputTV.text componentsSeparatedByString:@"\n"];
              NSMutableArray *ips = [NSMutableArray array];

              for (NSString *line in lines) {
                  NSString *trim = [line stringByTrimmingCharactersInSet:[NSCharacterSet whitespaceCharacterSet]];
                  if (trim.length == 0) continue;
                  NSArray *parts = [trim componentsSeparatedByString:@":"];
                  NSString *ip = parts.firstObject;
                  NSInteger port = 443;
                  if (parts.count > 1) port = [parts[1] integerValue];
                  if (port == 0) port = 443;
                  if ([ip containsString:@"."]) {
                      IPItem *item = [[IPItem alloc] init];
                      item.ip = ip;
                      item.port = port;
                      [ips addObject:item];
                  }
              }

              if (ips.count == 0) {
                  self.statusLabel.text = @"请导入有效IP";
                  return;
              }

              [self.results removeAllObjects];
              self.isScanning = YES;
              self.scanBtn.enabled = NO;
              self.stopBtn.enabled = YES;
              self.statusLabel.text = @"扫描中...";
              self.countLabel.text = [NSString stringWithFormat:@"总数: %lu  可用: 0", (unsigned long)ips.count];

              NSInteger port = [self.portField.text integerValue] ?: 443;
              NSInteger timeout = [self.timeoutField.text integerValue] ?: 3;

              NSMutableArray *allResults = [NSMutableArray array];
              NSLock *lock = [[NSLock alloc] init];
              dispatch_group_t group = dispatch_group_create();
              dispatch_semaphore_t sem = dispatch_semaphore_create(50);

              for (IPItem *item in ips) {
                  dispatch_group_enter(group);
                  dispatch_semaphore_wait(sem, DISPATCH_TIME_FOREVER);
                  dispatch_async(dispatch_get_global_queue(DISPATCH_QUEUE_PRIORITY_HIGH, 0), ^{
                      [self checkIP:item port:port timeout:timeout completion:^(IPItem *result) {
                          [lock lock];
                          if (result) [allResults addObject:result];
                          [lock unlock];
                          dispatch_semaphore_signal(sem);
                          dispatch_group_leave(group);
                          dispatch_async(dispatch_get_main_queue(), ^{
                              self.results = [allResults mutableCopy];
                              [self.tableView reloadData];
                              self.countLabel.text = [NSString stringWithFormat:@"总数: %lu  可用: %lu", (unsigned long)ips.count, (unsigned long)allResults.count];
                              self.statusLabel.text = [NSString stringWithFormat:@"扫描中... %lu 个", (unsigned long)allResults.count];
                          });
                      }];
                  });
              }

              dispatch_group_notify(group, dispatch_get_main_queue(), ^{
                  self.isScanning = NO;
                  self.scanBtn.enabled = YES;
                  self.stopBtn.enabled = NO;
                  self.statusLabel.text = [NSString stringWithFormat:@"✅ 完成！共 %lu 个", (unsigned long)allResults.count];
                  [self updateOutput];
              });
          }

          // ===== 检查IP =====
          - (void)checkIP:(IPItem *)item port:(NSInteger)port timeout:(NSInteger)timeout completion:(void(^)(IPItem *))completion {
              NSString *urlStr = [NSString stringWithFormat:@"https://%@:%ld/cdn-cgi/trace", item.ip, (long)port];
              NSURL *url = [NSURL URLWithString:urlStr];
              NSDate *start = [NSDate date];

              NSURLSessionConfiguration *cfg = [NSURLSessionConfiguration defaultSessionConfiguration];
              cfg.timeoutIntervalForRequest = timeout;
              cfg.timeoutIntervalForResource = timeout;
              NSURLSession *session = [NSURLSession sessionWithConfiguration:cfg];

              [[session dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                  if (data) {
                      NSHTTPURLResponse *http = (NSHTTPURLResponse *)response;
                      if (http.statusCode == 200) {
                          double delay = [[NSDate date] timeIntervalSinceDate:start] * 1000;
                          NSString *text = [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding];
                          NSString *colo = @"";
                          for (NSString *line in [text componentsSeparatedByString:@"\n"]) {
                              if ([line hasPrefix:@"colo="]) {
                                  colo = [line substringFromIndex:5];
                                  break;
                              }
                          }

                          IPItem *result = [[IPItem alloc] init];
                          result.ip = item.ip;
                          result.port = port;
                          result.delay = delay;
                          result.colo = colo;

                          NSString *locUrl = [NSString stringWithFormat:@"http://ip-api.com/json/%@?fields=country", item.ip];
                          [[[NSURLSession sharedSession] dataTaskWithURL:[NSURL URLWithString:locUrl] completionHandler:^(NSData *d, NSURLResponse *r, NSError *e) {
                              if (d) {
                                  NSDictionary *json = [NSJSONSerialization JSONObjectWithData:d options:0 error:nil];
                                  if (json[@"country"]) {
                                      result.country = json[@"country"];
                                  }
                              }
                              completion(result);
                          }] resume];
                          return;
                      }
                  }
                  completion(nil);
              }] resume];
          }

          // ===== 停止 =====
          - (void)onStop {
              self.isScanning = NO;
              self.scanBtn.enabled = YES;
              self.stopBtn.enabled = NO;
              self.statusLabel.text = @"已停止";
          }

          // ===== 更新输出 =====
          - (void)updateOutput {
              NSMutableString *text = [NSMutableString string];
              for (IPItem *item in self.results) {
                  [text appendFormat:@"%@:%ld  [%.0fms]  %@  %@\n", item.ip, (long)item.port, item.delay, item.country, item.colo];
              }
              UITextView *out = [self.view viewWithTag:200];
              out.text = text.length > 0 ? text : @"暂无数据";
              out.textColor = text.length > 0 ? [UIColor whiteColor] : [UIColor grayColor];
          }

          // ===== 复制 =====
          - (void)onCopy {
              NSMutableString *text = [NSMutableString string];
              for (IPItem *item in self.results) {
                  [text appendFormat:@"%@:%ld\n", item.ip, (long)item.port];
              }
              if (text.length > 0) {
                  [UIPasteboard generalPasteboard].string = text;
                  self.statusLabel.text = @"✅ 已复制";
              }
          }

          // ===== TableView =====
          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              return self.results.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"Cell" forIndexPath:indexPath];
              cell.backgroundColor = [UIColor clearColor];
              cell.textLabel.textColor = [UIColor whiteColor];
              cell.textLabel.font = [UIFont systemFontOfSize:11];
              IPItem *item = self.results[indexPath.row];
              cell.textLabel.text = [NSString stringWithFormat:@"%@:%ld  [%.0fms]  %@  %@", item.ip, (long)item.port, item.delay, item.country, item.colo];
              return cell;
          }

          - (CGFloat)tableView:(UITableView *)tableView heightForRowAtIndexPath:(NSIndexPath *)indexPath {
              return 30;
          }

          @end

          // ===== App入口 =====
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate

          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
              self.window.rootViewController = [[UINavigationController alloc] initWithRootViewController:[[MainVC alloc] init]];
              [self.window makeKeyAndVisible];
              return YES;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"AppDelegate");
              }
          }
          EOF

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 编译
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cd CloudFlareScan

          clang -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=15.0 \
            -framework UIKit \
            -framework Foundation \
            -fobjc-arc \
            -c main.m -o main.o

          clang -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=15.0 \
            -framework UIKit \
            -framework Foundation \
            -fobjc-arc \
            main.o -o CloudFlareScan

          cd ..

      - name: 打包
        run: |
          mkdir -p Payload/CloudFlareScan.app
          cp CloudFlareScan/CloudFlareScan Payload/CloudFlareScan.app/
          cp CloudFlareScan/Info.plist Payload/CloudFlareScan.app/

          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
