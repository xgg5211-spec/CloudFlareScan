name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: 创建源码
        run: |
          mkdir -p CloudFlareScan
          mkdir -p CloudFlareScan.xcodeproj

          cat > CloudFlareScan/App.swift << 'EOF'
          import SwiftUI

          @main
          struct CloudFlareScanApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

          cat > CloudFlareScan/ContentView.swift << 'EOF'
          import SwiftUI

          // ========== 颜色 ==========
          struct Colors {
              static let bg = Color(red: 0.06, green: 0.08, blue: 0.15)
              static let card = Color(red: 0.10, green: 0.13, blue: 0.22)
              static let blue = Color(red: 0.0, green: 0.6, blue: 0.9)
              static let green = Color(red: 0.0, green: 0.9, blue: 0.5)
              static let orange = Color(red: 1.0, green: 0.7, blue: 0.0)
              static let red = Color(red: 1.0, green: 0.3, blue: 0.3)
              static let gray = Color(red: 0.5, green: 0.6, blue: 0.8)
              static let white = Color.white
          }

          // ========== IP数据 ==========
          struct IPInfo: Identifiable {
              let id = UUID()
              var ip: String
              var port: Int
              var delay: Double
              var country: String
              var city: String
              var isp: String
              var colo: String
              var isAvailable: Bool

              var quality: String {
                  switch delay {
                  case ..<30: return "极速"
                  case ..<60: return "优秀"
                  case ..<100: return "良好"
                  case ..<200: return "一般"
                  default: return "较慢"
                  }
              }

              var qualityColor: Color {
                  switch delay {
                  case ..<30: return .purple
                  case ..<60: return Colors.green
                  case ..<100: return .blue
                  case ..<200: return Colors.orange
                  default: return Colors.red
                  }
              }
          }

          // ========== 扫描管理器 ==========
          class ScanManager: ObservableObject {
              @Published var results: [IPInfo] = []
              @Published var filtered: [IPInfo] = []
              @Published var isScanning = false
              @Published var status = "就绪"
              @Published var progress: Double = 0
              @Published var total = 0
              @Published var available = 0
              @Published var best: Double = 0
              @Published var avg: Double = 0
              @Published var isp = "检测中..."
              @Published var ip = "检测中..."
              @Published var country = "检测中..."
              @Published var input = ""
              @Published var port = 443
              @Published var timeout = 3
              @Published var thread = 100
              @Published var filterCountry = ""
              @Published var filterPort = ""

              private var task: Task<Void, Never>?

              let ports = [443, 2053, 2083, 2087, 2096, 8443]

              // ===== 检测运营商 =====
              func detect() {
                  guard let url = URL(string: "http://ip-api.com/json/?fields=isp,country,query") else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      guard let data = data else { return }
                      if let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                          DispatchQueue.main.async {
                              self.isp = json["isp"] as? String ?? "未知"
                              self.ip = json["query"] as? String ?? "未知"
                              self.country = json["country"] as? String ?? "未知"
                          }
                      }
                  }.resume()
              }

              // ===== 导入 =====
              func importIPs() {
                  let lines = input.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var list: [IPInfo] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          list.append(IPInfo(ip: ip, port: port, delay: 0, country: "", city: "", isp: "", colo: "", isAvailable: false))
                      }
                  }
                  results = []
                  filtered = []
                  available = 0
                  best = 0
                  avg = 0
                  status = "已导入 \(list.count) 个IP"
              }

              // ===== 生成IP =====
              func generate() {
                  let ranges = [
                      "173.245.48.0/20", "103.21.244.0/22", "103.22.200.0/22",
                      "103.31.4.0/22", "141.101.64.0/18", "108.162.192.0/18",
                      "190.93.240.0/20", "188.114.96.0/20", "197.234.240.0/22",
                      "198.41.128.0/17", "162.158.0.0/15", "104.16.0.0/13",
                      "104.24.0.0/14", "172.64.0.0/14", "131.0.72.0/22"
                  ]
                  var ips: [String] = []
                  for cidr in ranges {
                      let parts = cidr.split(separator: "/")
                      guard parts.count == 2, let prefix = Int(parts[1]) else { continue }
                      let ipParts = parts[0].split(separator: ".")
                      guard ipParts.count == 4 else { continue }
                      let base = (UInt32(ipParts[0])! << 24) | (UInt32(ipParts[1])! << 16) | (UInt32(ipParts[2])! << 8) | UInt32(ipParts[3])!
                      let count = 1 << (32 - prefix)
                      for i in 1...min(count, 100) {
                          let addr = base + UInt32(i)
                          ips.append("\((addr >> 24) & 255).\((addr >> 16) & 255).\((addr >> 8) & 255).\(addr & 255)")
                      }
                  }
                  input = ips.joined(separator: "\n")
                  status = "已生成 \(ips.count) 个IP"
              }

              // ===== 开始扫描 =====
              func startScan() {
                  let lines = input.split(separator: "\n").map { String($0).trimmingCharacters(in: .whitespaces) }
                  var ips: [IPInfo] = []
                  for line in lines {
                      if line.isEmpty { continue }
                      let parts = line.split(separator: ":")
                      let ip = String(parts[0])
                      let port = parts.count > 1 ? Int(parts[1]) ?? 443 : 443
                      if ip.contains(".") || ip.contains(":") {
                          ips.append(IPInfo(ip: ip, port: port, delay: 0, country: "", city: "", isp: "", colo: "", isAvailable: false))
                      }
                  }
                  guard !ips.isEmpty else { status = "请导入IP"; return }

                  isScanning = true
                  results = []
                  filtered = []
                  available = 0
                  best = 0
                  avg = 0
                  progress = 0
                  status = "扫描中..."
                  total = ips.count

                  let port = self.port
                  let timeout = self.timeout
                  var allResults: [IPInfo] = []
                  var processed = 0

                  task = Task.detached(priority: .high) {
                      let semaphore = DispatchSemaphore(value: self.thread)

                      await withTaskGroup(of: IPInfo?.self) { group in
                          for ip in ips {
                              if Task.isCancelled { break }
                              group.addTask {
                                  semaphore.wait()
                                  defer { semaphore.signal() }
                                  return await self.test(ip: ip, port: port, timeout: timeout)
                              }
                          }

                          for await result in group {
                              if let r = result {
                                  allResults.append(r)
                              }
                              processed += 1
                              await MainActor.run {
                                  let available = allResults.filter { $0.isAvailable }
                                  self.results = available
                                  self.available = available.count
                                  self.progress = Double(processed) / Double(self.total)
                                  let delays = available.map { $0.delay }.filter { $0 > 0 }
                                  if !delays.isEmpty {
                                      self.best = delays.min() ?? 0
                                      self.avg = delays.reduce(0, +) / Double(delays.count)
                                  }
                                  self.status = "扫描中... \(self.available) 个"
                                  self.applyFilter()
                              }
                          }
                      }

                      await MainActor.run {
                          self.isScanning = false
                          self.progress = 1.0
                          self.status = "✅ 完成！共 \(self.available) 个"
                      }
                  }
              }

              // ===== 测试IP =====
              private func test(ip: IPInfo, port: Int, timeout: Int) async -> IPInfo? {
                  let urlStr = "https://\(ip.ip):\(port)/cdn-cgi/trace"
                  guard let url = URL(string: urlStr) else { return nil }

                  let start = Date()
                  let config = URLSessionConfiguration.default
                  config.timeoutIntervalForRequest = TimeInterval(timeout)
                  config.timeoutIntervalForResource = TimeInterval(timeout)
                  let session = URLSession(configuration: config)

                  do {
                      let (data, response) = try await session.data(from: url)
                      if let http = response as? HTTPURLResponse, http.statusCode == 200 {
                          let delay = Date().timeIntervalSince(start) * 1000
                          let text = String(data: data, encoding: .utf8) ?? ""
                          var colo = ""
                          for line in text.split(separator: "\n") {
                              if line.hasPrefix("colo=") {
                                  colo = String(line.dropFirst(5))
                                  break
                              }
                          }

                          var result = ip
                          result.port = port
                          result.delay = delay
                          result.colo = colo
                          result.isAvailable = true

                          let locUrl = URL(string: "http://ip-api.com/json/\(ip.ip)?fields=country,city,isp")!
                          if let (data, _) = try? await URLSession.shared.data(from: locUrl),
                             let json = try? JSONSerialization.jsonObject(with: data) as? [String: Any] {
                              result.country = json["country"] as? String ?? ""
                              result.city = json["city"] as? String ?? ""
                              result.isp = json["isp"] as? String ?? ""
                          }
                          return result
                      }
                  } catch {
                      return nil
                  }
                  return nil
              }

              // ===== 停止 =====
              func stop() {
                  task?.cancel()
                  isScanning = false
                  status = "已停止"
              }

              // ===== 筛选 =====
              func applyFilter() {
                  var list = results
                  if !filterCountry.isEmpty {
                      list = list.filter { $0.country.localizedCaseInsensitiveContains(filterCountry) }
                  }
                  if !filterPort.isEmpty, let p = Int(filterPort) {
                      list = list.filter { $0.port == p }
                  }
                  filtered = list
              }

              // ===== 复制 =====
              func copyIPs() {
                  let text = filtered.map { "\($0.ip):\($0.port)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  status = "✅ 已复制"
              }

              func copyDetails() {
                  let text = filtered.map { "\($0.ip):\($0.port) [\(String(format: "%.0f", $0.delay))ms] \($0.country) \($0.colo)" }.joined(separator: "\n")
                  UIPasteboard.general.string = text
                  status = "✅ 已复制详情"
              }

              var output: String {
                  filtered.map { "\($0.ip):\($0.port) [\(String(format: "%.0f", $0.delay))ms] \($0.country) \($0.colo)" }.joined(separator: "\n")
              }
          }

          // ========== 主界面 ==========
          struct ContentView: View {
              @StateObject private var m = ScanManager()
              @State private var msg = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          Colors.bg.ignoresSafeArea()

                          ScrollView {
                              VStack(spacing: 10) {
                                  // 标题
                                  HStack {
                                      Text("🚀 优选IP筛选")
                                          .font(.title2)
                                          .fontWeight(.bold)
                                          .foregroundColor(.white)
                                      Spacer()
                                      if m.isScanning { ProgressView().scaleEffect(0.7) }
                                  }

                                  // 统计
                                  HStack(spacing: 8) {
                                      StatCard(label: "总数", value: "\(m.total)", color: .gray)
                                      StatCard(label: "可用", value: "\(m.available)", color: Colors.green)
                                      StatCard(label: "最佳", value: m.best > 0 ? String(format: "%.0fms", m.best) : "--", color: Colors.orange)
                                      StatCard(label: "平均", value: m.avg > 0 ? String(format: "%.0fms", m.avg) : "--", color: Colors.blue)
                                  }
                                  .padding(8)
                                  .background(Colors.card)
                                  .cornerRadius(10)

                                  // 运营商信息
                                  HStack {
                                      Text("📶 \(m.isp)")
                                          .font(.caption)
                                          .foregroundColor(Colors.blue)
                                      Spacer()
                                      Text("📍 \(m.country)")
                                          .font(.caption)
                                          .foregroundColor(Colors.gray)
                                      Text("🆔 \(m.ip)")
                                          .font(.caption)
                                          .foregroundColor(Colors.gray)
                                  }
                                  .padding(.horizontal, 10)
                                  .padding(.vertical, 6)
                                  .background(Colors.card)
                                  .cornerRadius(8)

                                  // 进度
                                  if m.isScanning {
                                      ProgressView(value: m.progress)
                                          .progressViewStyle(LinearProgressViewStyle(tint: Colors.blue))
                                  }

                                  // 导入
                                  VStack(alignment: .leading, spacing: 4) {
                                      HStack {
                                          Text("📂 导入IP").font(.headline).foregroundColor(.white)
                                          Spacer()
                                          Button("生成") { m.generate() }.font(.caption).foregroundColor(Colors.blue)
                                      }
                                      TextEditor(text: $m.input)
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 60)
                                          .background(Colors.bg)
                                          .cornerRadius(6)
                                  }
                                  .padding(10)
                                  .background(Colors.card)
                                  .cornerRadius(10)

                                  // 按钮
                                  HStack(spacing: 6) {
                                      Btn("📥 导入", .blue) { m.importIPs(); msg = "已导入" }
                                      Btn("▶ 扫描", .blue) { m.startScan() }.disabled(m.isScanning)
                                      Btn("⏹ 停止", .red) { m.stop() }.disabled(!m.isScanning)
                                      Btn("📋 复制", .purple) { m.copyIPs(); msg = "已复制" }.disabled(m.results.isEmpty)
                                      Btn("🗑 清空", .gray) {
                                          m.results = []; m.filtered = []; m.available = 0; m.best = 0; m.avg = 0; msg = "已清空"
                                      }
                                  }

                                  // 设置
                                  HStack {
                                      Picker("端口", selection: $m.port) {
                                          ForEach(m.ports, id: \.self) { Text("\($0)").tag($0) }
                                      }.pickerStyle(MenuPickerStyle()).frame(width: 70).tint(Colors.blue)

                                      Text("超时:").font(.caption2).foregroundColor(Colors.gray)
                                      TextField("3", value: $m.timeout, format: .number)
                                          .textFieldStyle(PlainTextFieldStyle()).frame(width: 35).foregroundColor(.white)

                                      Text("线程:").font(.caption2).foregroundColor(Colors.gray)
                                      TextField("100", value: $m.thread, format: .number)
                                          .textFieldStyle(PlainTextFieldStyle()).frame(width: 35).foregroundColor(.white)

                                      Spacer()
                                      Text(m.status).font(.caption2).foregroundColor(Colors.gray)
                                  }

                                  // 筛选
                                  HStack {
                                      Text("🔍 地区:").font(.caption2).foregroundColor(Colors.gray)
                                      TextField("筛选", text: $m.filterCountry)
                                          .textFieldStyle(PlainTextFieldStyle()).frame(width: 70).foregroundColor(.white)
                                          .onChange(of: m.filterCountry) { _ in m.applyFilter() }

                                      Text("端口:").font(.caption2).foregroundColor(Colors.gray)
                                      TextField("端口", text: $m.filterPort)
                                          .textFieldStyle(PlainTextFieldStyle()).frame(width: 40).foregroundColor(.white)
                                          .onChange(of: m.filterPort) { _ in m.applyFilter() }

                                      Spacer()
                                      Text("显示 \(m.filtered.count) 个").font(.caption2).foregroundColor(Colors.blue)
                                  }

                                  // 列表
                                  List(m.filtered) { ip in
                                      HStack {
                                          Text(ip.ip).font(.system(.caption, design: .monospaced)).foregroundColor(.white)
                                          Text(":\(ip.port)").font(.caption2).foregroundColor(Colors.gray)
                                          Spacer()
                                          Text("\(String(format: "%.0f", ip.delay))ms")
                                              .font(.caption).fontWeight(.bold).foregroundColor(ip.qualityColor)
                                          Text(ip.quality).font(.caption2)
                                          if !ip.colo.isEmpty { Text("🏢\(ip.colo)").font(.caption2).foregroundColor(Colors.blue) }
                                          Text("📍\(ip.country)").font(.caption2).foregroundColor(Colors.gray)
                                      }
                                      .padding(.vertical, 2)
                                  }
                                  .listStyle(.plain)
                                  .scrollContentBackground(.hidden)
                                  .frame(height: 180)

                                  // 输出
                                  VStack(alignment: .leading) {
                                      Text("📝 输出").font(.caption).foregroundColor(Colors.gray)
                                      TextEditor(text: .constant(m.output))
                                          .font(.system(.caption, design: .monospaced))
                                          .foregroundColor(.white)
                                          .frame(height: 50)
                                          .background(Colors.bg)
                                          .cornerRadius(6)
                                  }
                              }
                              .padding(.horizontal, 12)
                              .padding(.bottom, 16)
                          }
                      }
                      .navigationTitle("")
                      .navigationBarTitleDisplayMode(.inline)
                      .alert(msg, isPresented: .constant(!msg.isEmpty)) {
                          Button("确定") { msg = "" }
                      }
                      .onAppear {
                          m.detect()
                          m.input = "1.1.1.1\n8.8.8.8\n9.9.9.9\n104.16.0.0"
                      }
                  }
              }
          }

          struct StatCard: View {
              let label: String
              let value: String
              let color: Color
              var body: some View {
                  VStack(spacing: 0) {
                      Text(label).font(.caption2).foregroundColor(Colors.gray)
                      Text(value).font(.subheadline).fontWeight(.semibold).foregroundColor(color)
                  }.frame(maxWidth: .infinity)
              }
          }

          struct Btn: View {
              let title: String
              let color: Color
              let action: () -> Void
              var disabled: Bool = false

              init(_ title: String, _ color: Color, action: @escaping () -> Void) {
                  self.title = title
                  self.color = color
                  self.action = action
              }

              var body: some View {
                  Button(action: action) {
                      Text(title).font(.caption).padding(.horizontal, 8).padding(.vertical, 6)
                  }
                  .disabled(disabled)
                  .foregroundColor(color)
                  .background(color.opacity(0.15))
                  .cornerRadius(6)
                  .overlay(RoundedRectangle(cornerRadius: 6).stroke(color.opacity(0.3), lineWidth: 0.5))
              }
          }
          EOF

          cat > CloudFlareScan/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleExecutable</key>
              <string>CloudFlareScan</string>
              <key>CFBundleIdentifier</key>
              <string>com.cloudflarescan.ios</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>优选IP</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>armv7</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: 创建项目文件
        run: |
          cat > CloudFlareScan.xcodeproj/project.pbxproj << 'EOF'
          // !$*UTF8*$!
          {
              archiveVersion = 1;
              classes = {};
              objectVersion = 56;
              objects = {
                  B100000001 /* App.swift in Sources */ = {isa = PBXBuildFile; fileRef = B100000002 /* App.swift */; };
                  B100000003 /* ContentView.swift in Sources */ = {isa = PBXBuildFile; fileRef = B100000004 /* ContentView.swift */; };
                  B100000002 /* App.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>"; };
                  B100000004 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                  B100000005 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                  B100000006 /* CloudFlareScan.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = CloudFlareScan.app; sourceTree = BUILT_PRODUCTS_DIR; };
                  B100000007 = {isa = PBXGroup; children = (B100000008, B100000009,); sourceTree = "<group>"; };
                  B100000008 /* CloudFlareScan */ = {isa = PBXGroup; children = (B100000002, B100000004, B100000005,); path = CloudFlareScan; sourceTree = "<group>"; };
                  B100000009 /* Products */ = {isa = PBXGroup; children = (B100000006,); name = Products; sourceTree = "<group>"; };
                  B100000010 /* CloudFlareScan */ = {isa = PBXNativeTarget; buildConfigurationList = B100000011; buildPhases = (B100000012, B100000013,); buildRules = (); dependencies = (); name = CloudFlareScan; productName = CloudFlareScan; productReference = B100000006; productType = "com.apple.product-type.application"; };
                  B100000014 /* Project object */ = {isa = PBXProject; attributes = {LastSwiftUpdateCheck = 1500; LastUpgradeCheck = 1500; TargetAttributes = {B100000010 = {CreatedOnToolsVersion = 15.0;};};}; buildConfigurationList = B100000015; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base,); mainGroup = B100000007; productRefGroup = B100000009; projectDirPath = ""; projectRoot = ""; targets = (B100000010,); };
                  B100000013 /* Resources */ = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
                  B100000012 /* Sources */ = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (B100000001, B100000003,); runOnlyForDeploymentPostprocessing = 0; };
                  B100000016 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  B100000017 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {IPHONEOS_DEPLOYMENT_TARGET = 15.0; SDKROOT = iphoneos; SWIFT_VERSION = 5.0; TARGETED_DEVICE_FAMILY = "1,2"; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  B100000018 /* Debug */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Debug; };
                  B100000019 /* Release */ = {isa = XCBuildConfiguration; buildSettings = {ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon; CODE_SIGN_STYLE = Manual; CURRENT_PROJECT_VERSION = 1; DEVELOPMENT_TEAM = ""; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_FILE = CloudFlareScan/Info.plist; MARKETING_VERSION = 1.0; PRODUCT_BUNDLE_IDENTIFIER = com.cloudflarescan.ios; PRODUCT_NAME = CloudFlareScan; SWIFT_VERSION = 5.0; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;}; name = Release; };
                  B100000011 = {isa = XCConfigurationList; buildConfigurations = (B100000018, B100000019,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
                  B100000015 = {isa = XCConfigurationList; buildConfigurations = (B100000016, B100000017,); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              };
              rootObject = B100000014;
          }
          EOF

      - name: 编译
        run: |
          xcodebuild -project CloudFlareScan.xcodeproj \
            -scheme CloudFlareScan \
            -configuration Release \
            -derivedDataPath build \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "未找到 .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r CloudFlareScan.ipa Payload
          cp CloudFlareScan.ipa CloudFlareScan.tipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: CloudFlareScan-TrollStore
          path: |
            *.ipa
            *.tipa
