              self.importBtn.frame = CGRectMake(148, 5, 60, 34);
              [self.importBtn addTarget:self action:@selector(importIPs) forControlEvents:UIControlEventTouchUpInside];
              [btnBg addSubview:self.importBtn];

              self.resultCopyBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              [self.resultCopyBtn setTitle:@"📋 复制" forState:UIControlStateNormal];
              [self.resultCopyBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              self.resultCopyBtn.backgroundColor = [UIColor colorWithRed:0.5 green:0.3 blue:0.8 alpha:1];
